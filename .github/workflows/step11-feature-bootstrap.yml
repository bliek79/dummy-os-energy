name: Step 11 feature bootstrap

on:
  push:
    branches:
      - step11-meaningful-confidence-observer-v2
    paths:
      - .github/workflows/step11-feature-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step11-meaningful-confidence-observer-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Step 11 observer integration
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('custom_components/dummy_os_data/home_input_sensor.py')
          text = home.read_text()
          old = 'from .fallback_hierarchy import calculate_fallback_hierarchy\n'
          new = old + 'from .meaningful_confidence import calculate_meaningful_confidence\n'
          assert old in text and 'calculate_meaningful_confidence' not in text
          text = text.replace(old, new, 1)

          marker = '\n\ndef build_home_input_sensors(\n'
          assert marker in text
          cls = '''\n\nclass DummyOSEnergyMeaningfulConfidenceSensor(SensorEntity):
              """Observer-only Step 11 meaningful-confidence diagnostics."""

              _attr_should_poll = False
              _attr_has_entity_name = False
              _attr_name = "DO Energy Meaningful Confidence"
              _attr_unique_id = "do_energy_meaningful_confidence"
              _attr_suggested_object_id = "do_energy_meaningful_confidence"
              _attr_icon = "mdi:gauge"
              _unrecorded_attributes = frozenset({"production_buckets", "candidate_buckets"})

              def __init__(self, coordinator: DummyOSHomeDataCoordinator) -> None:
                  self.coordinator = coordinator
                  self._remove_listener = None

              @property
              def device_info(self) -> DeviceInfo:
                  return DeviceInfo(
                      identifiers={(DOMAIN, "main")},
                      name=NAME,
                      manufacturer="Dummy OS",
                      model="Forecast Platform",
                      sw_version=VERSION,
                  )

              async def async_added_to_hass(self) -> None:
                  await super().async_added_to_hass()
                  self._remove_listener = self.coordinator.async_add_listener(self._handle_update)

              async def async_will_remove_from_hass(self) -> None:
                  if self._remove_listener is not None:
                      self._remove_listener()
                  await super().async_will_remove_from_hass()

              @callback
              def _handle_update(self) -> None:
                  self.async_write_ha_state()

              def _result(self) -> dict[str, Any]:
                  return calculate_meaningful_confidence(
                      self.coordinator.records,
                      self.coordinator.evaluations,
                      self.coordinator.profile,
                      dt_util.as_local,
                  )

              @property
              def native_value(self) -> str:
                  return str(self._result()["status"])

              @property
              def extra_state_attributes(self) -> dict[str, Any]:
                  return dict(self._result())
          '''
          import textwrap
          cls = textwrap.dedent(cls)
          text = text.replace(marker, cls + marker, 1)
          old_append = '    entities.append(DummyOSEnergyFallbackHierarchySensor(coordinator))\n    return entities\n'
          new_append = '    entities.append(DummyOSEnergyFallbackHierarchySensor(coordinator))\n    entities.append(DummyOSEnergyMeaningfulConfidenceSensor(coordinator))\n    return entities\n'
          assert old_append in text
          text = text.replace(old_append, new_append, 1)
          home.write_text(text)

          migrations = Path('custom_components/dummy_os_data/entity_migrations.py')
          text = migrations.read_text()
          old = '    "do_energy_fallback_hierarchy": "sensor.dummy_os_forecast_do_energy_fallback_hierarchy",\n'
          new = old + '    "do_energy_meaningful_confidence": "sensor.dummy_os_forecast_do_energy_meaningful_confidence",\n'
          assert old in text and 'do_energy_meaningful_confidence' not in text
          migrations.write_text(text.replace(old, new, 1))

          init = Path('custom_components/dummy_os_data/__init__.py')
          text = init.read_text()
          old = '    ("sensor", "do_energy_fallback_hierarchy", "sensor.do_energy_fallback_hierarchy"),\n'
          new = old + '    ("sensor", "do_energy_meaningful_confidence", "sensor.do_energy_meaningful_confidence"),\n'
          assert old in text and 'do_energy_meaningful_confidence' not in text
          init.write_text(text.replace(old, new, 1))

          Path('tests/test_meaningful_confidence.py').write_text('''from datetime import datetime, timedelta, timezone\n\nfrom custom_components.dummy_os_data.meaningful_confidence import (\n    _candidate_confidence,\n    _historical_components,\n)\n\n\ndef _samples(values):\n    now = datetime(2026, 9, 7, 12, 0, tzinfo=timezone.utc)\n    return now, [(now - timedelta(days=i), value, 1.0) for i, value in enumerate(values)]\n\n\ndef test_stable_history_scores_higher_than_volatile_history():\n    now, stable = _samples([0.10, 0.101, 0.099, 0.10, 0.102, 0.098])\n    _, volatile = _samples([0.02, 0.20, 0.03, 0.18, 0.04, 0.22])\n    stable_components = _historical_components(stable, captured_at=now)\n    volatile_components = _historical_components(volatile, captured_at=now)\n    assert stable_components["stability_factor"] > volatile_components["stability_factor"]\n    stable_score = _candidate_confidence(source="weekday_quarter", components=stable_components, recent_error_factor=0.8)\n    volatile_score = _candidate_confidence(source="weekday_quarter", components=volatile_components, recent_error_factor=0.8)\n    assert stable_score > volatile_score\n\n\ndef test_deeper_fallback_reduces_confidence():\n    now, samples = _samples([0.10, 0.11, 0.09, 0.10, 0.10, 0.09])\n    components = _historical_components(samples, captured_at=now)\n    exact = _candidate_confidence(source="weekday_quarter", components=components, recent_error_factor=0.8)\n    broad = _candidate_confidence(source="profile_mean", components=components, recent_error_factor=0.8)\n    assert exact > broad\n''')

          Path('tests/test_meaningful_confidence_sensor_contract.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).parents[1]\nSOURCE = (ROOT / "custom_components/dummy_os_data/home_input_sensor.py").read_text()\nINIT = (ROOT / "custom_components/dummy_os_data/__init__.py").read_text()\nMIGRATIONS = (ROOT / "custom_components/dummy_os_data/entity_migrations.py").read_text()\nCORE = (ROOT / "custom_components/dummy_os_data/meaningful_confidence.py").read_text()\n\n\ndef test_step11_sensor_identity_and_registration():\n    assert '_attr_name = "DO Energy Meaningful Confidence"' in SOURCE\n    assert '_attr_unique_id = "do_energy_meaningful_confidence"' in SOURCE\n    assert '_attr_suggested_object_id = "do_energy_meaningful_confidence"' in SOURCE\n    assert 'DummyOSEnergyMeaningfulConfidenceSensor(coordinator)' in SOURCE\n    assert '("sensor", "do_energy_meaningful_confidence", "sensor.do_energy_meaningful_confidence")' in INIT\n    assert '"do_energy_meaningful_confidence": "sensor.dummy_os_forecast_do_energy_meaningful_confidence"' in MIGRATIONS\n\n\ndef test_step11_is_observer_only_and_cannot_promote_itself():\n    assert '"observer_only": True' in CORE\n    assert '"forecast_influence_enabled": False' in CORE\n    assert '"production_confidence_unchanged": True' in CORE\n    assert '"promotion_ready": False' in CORE\n    assert '"live_shadow_required": True' in CORE\n    assert 'ALGORITHM_VERSION = "meaningful_confidence_observer_v1"' in CORE\n''')
          PY
      - name: Compile and test
        run: |
          python -m pip install --upgrade pytest
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Commit feature and remove bootstrap
        run: |
          rm .github/workflows/step11-feature-bootstrap.yml
          git config user.name "Stefan"
          git config user.email "111599445+bliek79@users.noreply.github.com"
          git add custom_components/dummy_os_data tests .github/workflows/step11-feature-bootstrap.yml
          git commit -m "Step 11: integrate meaningful confidence observer"
          git push origin HEAD:step11-meaningful-confidence-observer-v2
