name: Publish alpha.52 (Source, Solar, Weather, Degree Days only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alpha52.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Final release tests
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python - <<'PY'
          import ast, json
          from pathlib import Path
          root = Path('custom_components/dummy_os_data')
          version = next(ast.literal_eval(n.value) for n in ast.parse((root/'const.py').read_text()).body
                         if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id=='VERSION' for t in n.targets))
          assert version == json.loads((root/'manifest.json').read_text())['version'] == '0.2.0-alpha.52'
          assert (Path('RELEASE_NOTES_0.2.0-alpha.52.md')).is_file()
          assert not (root/'prices.py').exists()
          assert not (root/'forecast.py').exists()
          PY
      - name: Package and verify exact tested sources
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('custom_components/dummy_os_data')
          sources = [p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc']
          archive_path = Path('dist/Dummy_OS_Energy_0.2.0-alpha.52_HA_install.zip')
          with zipfile.ZipFile(archive_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(sources): archive.write(p, p.relative_to(root.parent))
          with zipfile.ZipFile(archive_path) as archive:
              for p in sources: assert archive.read(str(p.relative_to(root.parent))) == p.read_bytes()
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in archive.namelist())
          PY
          sha256sum dist/*.zip | sed 's#dist/##' > dist/SHA256SUMS-0.2.0-alpha.52.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh release create 0.2.0-alpha.52 dist/*.zip dist/SHA256SUMS-0.2.0-alpha.52.txt \
            --title 'Dummy OS Energy 0.2.0-alpha.52 - Remove Home Forecast and Prices' \
            --notes-file RELEASE_NOTES_0.2.0-alpha.52.md --prerelease --target "$GITHUB_SHA"
