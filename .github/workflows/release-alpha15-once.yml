name: Publish Dummy OS Energy 0.2.0-alpha.15 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-alpha15-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: d86cbaff099aeb949dabf76e5bf8c157c33cb53b
      TAG: 0.2.0-alpha.15
      ZIP_NAME: Dummy_OS_Energy_0.2.0-alpha.15_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-0.2.0-alpha.15.txt
      RELEASE_TITLE: Dummy OS Energy 0.2.0-alpha.15 - Step 6B Performance and Version Hotfix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d86cbaff099aeb949dabf76e5bf8c157c33cb53b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Final release gate
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.15"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.15"' custom_components/dummy_os_data/manifest.json
          grep -F 'VERSION = "0.2.0-alpha.15"' tests/test_release_consistency.py
          grep -F '**Tag:** `0.2.0-alpha.15`' RELEASE_NOTES.md
      - name: Build installation asset and checksum
        run: |
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
      - name: Write release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('RELEASE_NOTES.md').read_text()
          marker = '\n---\n# GitHub Release\n'
          first = text.split(marker, 1)[0]
          Path('release_notes_alpha15.md').write_text(first + '\n')
          PY
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "$ZIP_NAME" \
            "$CHECKSUM_NAME" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes_alpha15.md \
            --prerelease
