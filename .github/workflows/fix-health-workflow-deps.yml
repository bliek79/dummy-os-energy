name: Fix health workflow dependency

on:
  push:
    branches:
      - pre-step5-health-fix
    paths:
      - .github/workflows/fix-health-workflow-deps.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-step5-health-fix
          fetch-depth: 0
      - name: Add pytest install to health workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-pre-step5-health-fix.yml')
          text = path.read_text()
          old = '''      - name: Validate patched sources\n        run: |\n          python -m compileall -q custom_components/dummy_os_data tests\n          python -m pytest -q\n'''
          new = '''      - name: Validate patched sources\n        run: |\n          python -m pip install --upgrade pytest\n          python -m compileall -q custom_components/dummy_os_data tests\n          python -m pytest -q\n'''
          if old not in text:
              raise SystemExit('validation step marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-pre-step5-health-fix.yml
          git commit -m "Install pytest in pre-Step-5 health workflow"
          git push origin HEAD:pre-step5-health-fix
