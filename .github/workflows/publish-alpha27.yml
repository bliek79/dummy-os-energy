name: Publish alpha.27

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-alpha27.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.2.0-alpha.27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Final release gate
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.27"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.27"' custom_components/dummy_os_data/manifest.json
          test -f RELEASE_NOTES_0.2.0-alpha.27.md
          python -m pytest -q tests/test_do_plan_reserve_soc.py tests/test_do_plan_grid_support.py tests/test_do_plan_72h.py
      - name: Build install assets
        run: |
          mkdir -p dist
          cd custom_components
          zip -qr ../dist/Dummy_OS_Energy_0.2.0-alpha.27_HA_install.zip dummy_os_data
          cd ..
          sha256sum dist/Dummy_OS_Energy_0.2.0-alpha.27_HA_install.zip | sed 's#dist/##' > dist/SHA256SUMS-0.2.0-alpha.27.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Dummy OS Energy $VERSION - Grid Support Capacity Handoff Fix"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            dist/Dummy_OS_Energy_0.2.0-alpha.27_HA_install.zip \
            dist/SHA256SUMS-0.2.0-alpha.27.txt \
            --title "Dummy OS Energy 0.2.0-alpha.27 - Grid Support Capacity Handoff Fix" \
            --notes-file RELEASE_NOTES_0.2.0-alpha.27.md \
            --prerelease \
            --verify-tag

# Release gate refresh after release-notes heading alignment.
