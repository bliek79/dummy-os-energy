name: Publish Dummy OS Energy 0.2.0-alpha.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0.2.0-alpha.3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
      VERSION: 0.2.0-alpha.3
      ZIP_NAME: Dummy_OS_Energy_0.2.0-alpha.3_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-0.2.0-alpha.3.txt
      RELEASE_TITLE: Dummy OS Energy 0.2.0-alpha.3 - DO Plan Energy Need
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile and test
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify Planner Step 2 invariants
        run: |
          grep -F 'VERSION = "0.2.0-alpha.3"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.3"' custom_components/dummy_os_data/manifest.json
          grep -F '_attr_unique_id = "do_plan_energy_need"' custom_components/dummy_os_data/sensor.py
          grep -F '"physical_execution_authority": False' custom_components/dummy_os_data/do_plan_energy_need.py
          grep -F '"shadow_only": True' custom_components/dummy_os_data/do_plan_energy_need.py
          grep -F '"active_use_permitted": False' custom_components/dummy_os_data/do_plan_energy_need.py
          grep -F '**Tag:** `0.2.0-alpha.3`' RELEASE_NOTES.md
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Prepare current release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('RELEASE_NOTES.md').read_text(encoding='utf-8')
          current = text.split('\n---\n', 1)[0].strip() + '\n'
          Path('/tmp/release-notes.md').write_text(current, encoding='utf-8')
          PY
      - name: Build package
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          cat "$CHECKSUM_NAME"
      - name: Create tag and pre-release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          git tag "$VERSION" "$RELEASE_COMMIT"
          git push origin "$VERSION"
          gh release create "$VERSION" "$ZIP_NAME" "$CHECKSUM_NAME" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file /tmp/release-notes.md --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-os-energy-0.2.0-alpha.3-published-assets
          path: |
            Dummy_OS_Energy_0.2.0-alpha.3_HA_install.zip
            SHA256SUMS-0.2.0-alpha.3.txt
            RELEASE_NOTES.md
