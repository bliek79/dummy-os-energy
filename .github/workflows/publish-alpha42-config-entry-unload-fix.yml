name: Publish alpha.42 config-entry unload fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-alpha42-config-entry-unload-fix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest pytest-asyncio

      - name: Compile integration and tests
        run: python -m compileall -q custom_components/dummy_os_data tests

      - name: Run unload lifecycle regression
        run: python -m pytest -q tests/test_config_entry_unload_lifecycle.py

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Verify release contract
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          root = Path('custom_components/dummy_os_data')
          version = next(
              ast.literal_eval(node.value)
              for node in ast.parse((root / 'const.py').read_text()).body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == 'VERSION' for t in node.targets)
          )
          assert version == json.loads((root / 'manifest.json').read_text())['version'] == '0.2.0-alpha.42'
          init = (root / '__init__.py').read_text()
          assert 'entry.async_on_unload(lambda: hass.async_create_task(' not in init
          assert 'entry.async_on_unload(source_setup_task.cancel)' not in init
          assert 'await runtime.async_shutdown_shadow()' in init
          assert 'source_setup_task.cancel()' in init
          assert Path('RELEASE_NOTES_0.2.0-alpha.42.md').is_file()
          PY

      - name: Package and verify tested sources
        run: |
          mkdir -p dist
          python - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path('custom_components/dummy_os_data')
          sources = [
              p for p in root.rglob('*')
              if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc'
          ]
          target = Path('dist/Dummy_OS_Energy_0.2.0-alpha.42_HA_install.zip')
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(sources):
                  archive.write(p, p.relative_to(root.parent))
          with zipfile.ZipFile(target) as archive:
              for p in sources:
                  assert archive.read(str(p.relative_to(root.parent))) == p.read_bytes(), str(p)
              assert not any('__pycache__' in name or name.endswith('.pyc') for name in archive.namelist())
          PY
          sha256sum dist/*.zip | sed 's#dist/##' > dist/SHA256SUMS-0.2.0-alpha.42.txt

      - name: Publish prerelease
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a 0.2.0-alpha.42 -m 'Dummy OS Energy 0.2.0-alpha.42 - Config Entry Unload Fix'
          git push origin 0.2.0-alpha.42
          gh release create 0.2.0-alpha.42 dist/*.zip dist/SHA256SUMS-0.2.0-alpha.42.txt \
            --title 'Dummy OS Energy 0.2.0-alpha.42 - Config Entry Unload Fix' \
            --notes-file RELEASE_NOTES_0.2.0-alpha.42.md --prerelease --verify-tag
