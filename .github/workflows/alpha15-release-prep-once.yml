name: Prepare alpha15 release metadata once

on:
  push:
    branches:
      - alpha15-release-prep
    paths:
      - .github/workflows/alpha15-release-prep-once.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare alpha15 release metadata workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha15-release-prep
          fetch-depth: 0
      - name: Update all current version sources and release notes
        run: |
          python - <<'PY'
          from pathlib import Path

          version = '0.2.0-alpha.15'

          const = Path('custom_components/dummy_os_data/const.py')
          text = const.read_text()
          text = text.replace('VERSION = "0.2.0-alpha.13"', f'VERSION = "{version}"')
          const.write_text(text)

          manifest = Path('custom_components/dummy_os_data/manifest.json')
          text = manifest.read_text()
          text = text.replace('"version": "0.2.0-alpha.13"', f'"version": "{version}"')
          manifest.write_text(text)

          gate = Path('tests/test_release_consistency.py')
          text = gate.read_text()
          text = text.replace('VERSION = "0.2.0-alpha.13"', f'VERSION = "{version}"')
          gate.write_text(text)

          notes = Path('RELEASE_NOTES.md')
          existing = notes.read_text()
          header = '''# GitHub Release\n\n**Tag:** `0.2.0-alpha.15`  \n**Release title:** Dummy OS Energy 0.2.0-alpha.15 - Step 6B Performance and Version Hotfix\n\n## Dummy OS Energy 0.2.0-alpha.15\n\nDeze prerelease is een gerichte hotfix na de live alpha.14-validatie. Hij corrigeert de versiebronfout van alpha.14 en vermindert de extra Step-6B Plan Store Bridge-belasting zonder de plannerarchitectuur of safetygrenzen te wijzigen.\n\n### Opgelost\n- De repositoryversie staat vóór tagging consequent op `0.2.0-alpha.15` in `const.py`, `manifest.json` en de release-consistency gate.\n- De Plan Store Bridge gebruikt een deterministische material-input fingerprint.\n- Binnen hetzelfde native kwartier wordt de zware input -> reserve -> preview -> plan72 -> grid-support keten niet opnieuw berekend wanneer plannerrelevante input inhoudelijk gelijk blijft.\n- Echte wijzigingen in profiel, SOC, historie/evaluaties, solar of prijzen invalidëren de cache direct.\n- Een nieuw native 15-minutenkwartier forceert opnieuw een geldige plannerberekening.\n- De bestaande Plan Store, candidate-identiteit, reconciliation en persistente shadow-store blijven inhoudelijk ongewijzigd.\n\n### Architectuur en safety ongewijzigd\n- native resolutie: 15 minuten;\n- horizon: 72 uur;\n- exact 288 slots;\n- Plan Store: exact 3 slots;\n- `shadow_only=true`;\n- `shadow_store_write=true`;\n- `operational_plan_store_write=false`;\n- `active_use_permitted=false`;\n- `physical_execution_authority=false`;\n- `scheduler_invoked=false`;\n- `safety_chain_invoked=false`;\n- `service_calls_performed=false`.\n\n### Bewust niet gewijzigd\n- Grid Support shadow-testgrens blijft 0,25 kWh;\n- geen Planner Stap 7 Scheduler;\n- geen Safety/Prestart;\n- geen Execution;\n- geen fysieke Home Assistant-servicecalls;\n- geen dashboardmigratie.\n\n### Live-validatie na installatie\n- Home Assistant moet de integratie als `0.2.0-alpha.15` tonen.\n- Controleer de startup/update-log specifiek op nieuwe `dummy_os_data` main-threadwaarschuwingen.\n- `sensor.dummy_os_energy_do_plan_store_bridge` moet `ready` blijven en `skipped_refreshes` moet bij ongewijzigde refreshes kunnen oplopen.\n- Een echte plannerinputwijziging of nieuwe kwartiergrens moet de bridge opnieuw laten rekenen.\n- Alle shadow/safetyvlaggen moeten gesloten blijven.\n\n---\n'''
          if not existing.startswith('# GitHub Release\n\n**Tag:** `0.2.0-alpha.15`'):
              notes.write_text(header + existing)

          Path('.github/workflows/alpha15-release-prep-once.yml').unlink()
          PY
      - name: Verify metadata before commit
        run: |
          grep -F 'VERSION = "0.2.0-alpha.15"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.15"' custom_components/dummy_os_data/manifest.json
          grep -F 'VERSION = "0.2.0-alpha.15"' tests/test_release_consistency.py
          grep -F '**Tag:** `0.2.0-alpha.15`' RELEASE_NOTES.md
          grep -F '## Dummy OS Energy 0.2.0-alpha.15' RELEASE_NOTES.md
      - name: Commit release preparation
        run: |
          git config user.name "bliek79"
          git config user.email "111599445+bliek79@users.noreply.github.com"
          git add custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_release_consistency.py RELEASE_NOTES.md .github/workflows/alpha15-release-prep-once.yml
          git commit -m "Prepare 0.2.0-alpha.15 release metadata"
          git push origin HEAD:alpha15-release-prep
