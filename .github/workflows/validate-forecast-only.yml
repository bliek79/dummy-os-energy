name: Validate Dummy OS Data reduced forecast scope

on:
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/dummy_os_data/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'RELEASE_NOTES*.md'
      - '.github/workflows/validate-forecast-only.yml'
      - '.github/workflows/publish-alpha52.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile all shipped modules and tests
        run: python -m compileall -q custom_components/dummy_os_data tests
      - name: Full regression suite
        run: python -m pytest -q
      - name: Release and scope guard
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          root = Path('custom_components/dummy_os_data')
          const = (root / 'const.py').read_text()
          manifest = json.loads((root / 'manifest.json').read_text())
          version = next(ast.literal_eval(node.value) for node in ast.parse(const).body
                         if isinstance(node, ast.Assign) and any(isinstance(x, ast.Name) and x.id == 'VERSION' for x in node.targets))
          assert version == manifest['version'] == '0.2.0-alpha.52'
          assert 'PLATFORMS = ["sensor"]' in const
          assert not (root / 'prices.py').exists()
          assert not (root / 'forecast.py').exists()
          assert 'build_solar_sensors(coordinator)' in (root / 'sensor.py').read_text()
          assert 'build_degree_days_sensors(coordinator)' in (root / 'sensor.py').read_text()
          PY
