name: Publish Dummy OS Energy 0.2.0-alpha.5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0.2.0-alpha.5.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
      VERSION: 0.2.0-alpha.5
      ZIP_NAME: Dummy_OS_Energy_0.2.0-alpha.5_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-0.2.0-alpha.5.txt
      RELEASE_TITLE: Dummy OS Energy 0.2.0-alpha.5 - DO Plan Preview
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile and test
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify Planner Step 4 invariants
        run: |
          grep -F 'VERSION = "0.2.0-alpha.5"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.5"' custom_components/dummy_os_data/manifest.json
          grep -F '_attr_unique_id = "do_plan_preview"' custom_components/dummy_os_data/do_plan_preview_sensor.py
          grep -F '"physical_execution_authority": False' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"shadow_only": True' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"active_use_permitted": False' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"reserve_recalculated": False' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"prices_fallback_used": False' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"missing_as_zero_used": False' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '**Tag:** `0.2.0-alpha.5`' RELEASE_NOTES_0.2.0-alpha.5.md
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Build package
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          cat "$CHECKSUM_NAME"
      - name: Create tag and pre-release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          git tag "$VERSION" "$RELEASE_COMMIT"
          git push origin "$VERSION"
          gh release create "$VERSION" "$ZIP_NAME" "$CHECKSUM_NAME" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES_0.2.0-alpha.5.md --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-os-energy-0.2.0-alpha.5-published-assets
          path: |
            Dummy_OS_Energy_0.2.0-alpha.5_HA_install.zip
            SHA256SUMS-0.2.0-alpha.5.txt
            RELEASE_NOTES_0.2.0-alpha.5.md
