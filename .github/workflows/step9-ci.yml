name: Validate Step 9 Profile Contract
# Historical name retained for branch-check compatibility; the old Home Forecast profile has been retired.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile and test all remaining modules
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
      - name: Verify migration to alpha.52 data runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('custom_components/dummy_os_data')
          c = (root/'const.py').read_text()
          assert json.loads((root/'manifest.json').read_text())['version'] == '0.2.0-alpha.52'
          assert 'PLATFORMS = ["sensor"]' in c
          assert 'QUARTER_MINUTES = 15' in c
          assert 'FORECAST_HORIZON_HOURS = 72' in c
          assert 'FORECAST_SLOTS = FORECAST_HORIZON_HOURS * 60 // QUARTER_MINUTES' in c
          assert not (root/'forecast.py').exists()
          assert not (root/'prices.py').exists()
          init = (root/'__init__.py').read_text()
          assert 'coordinator.weather.async_setup()' in init
          assert 'coordinator.solar.async_setup()' in init
          assert 'coordinator.degree_days.async_setup()' in init
          PY

