name: Publish Dummy OS Energy alpha.20

on:
  push:
    branches:
      - publish-alpha20
    paths:
      - .github/workflows/publish-alpha20.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VERSION: 0.2.0-alpha.20
      RELEASE_COMMIT: 02b1bc86f058e01f566e62d91aa0d97e3336e184
      ZIP_NAME: Dummy_OS_Energy_0.2.0-alpha.20_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-0.2.0-alpha.20.txt
      RELEASE_TITLE: Dummy OS Energy 0.2.0-alpha.20 - Manual Lifecycle Diagnostic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile sources
        run: python -m compileall -q custom_components/dummy_os_data tests
      - name: Run full tests
        run: python -m pytest -q
      - name: Validate manifest and exact release metadata
        run: |
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.20"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.20"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.20`' RELEASE_NOTES_0.2.0-alpha.20.md
          grep -F 'QUARTER_MINUTES = 15' custom_components/dummy_os_data/const.py
          grep -F 'FORECAST_HORIZON_HOURS = 72' custom_components/dummy_os_data/const.py
      - name: Build Home Assistant install ZIP and checksum
        run: |
          rm -f "$ZIP_NAME" "$CHECKSUM_NAME"
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          cat "$CHECKSUM_NAME"
      - name: Create tag and prerelease with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$VERSION" "$RELEASE_COMMIT"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" \
            "$ZIP_NAME" \
            "$CHECKSUM_NAME" \
            --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES_0.2.0-alpha.20.md \
            --prerelease
