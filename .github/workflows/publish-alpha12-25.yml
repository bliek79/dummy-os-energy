name: Publish Dummy OS Forecast alpha.12.25

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha12-25.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
      VERSION: 0.1.0-alpha.12.25
      RELEASE_COMMIT: c8b2d37b08bbe540a51bf87b945d7aae3a7a6a7a
      ZIP_NAME: Dummy_OS_Forecast_0.1.0-alpha.12.25_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-alpha12.25.txt
      RELEASE_TITLE: Dummy OS Forecast 0.1.0-alpha.12.25 - Step 14 Exact 72 Complete Planner Hours
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c8b2d37b08bbe540a51bf87b945d7aae3a7a6a7a
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Verify pinned release commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - name: Compile and test
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify Step 14 release invariants
        run: |
          grep -F 'VERSION = "0.1.0-alpha.12.25"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.1.0-alpha.12.25"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.1.0-alpha.12.25`' RELEASE_NOTES.md
          grep -F 'MAX_INTERNAL_FORECAST_SLOTS = FORECAST_SLOTS + 3' custom_components/dummy_os_data/forecast.py
          grep -F 'slot_count: int = FORECAST_SLOTS' custom_components/dummy_os_data/forecast.py
          grep -F 'RECENCY_HALF_LIFE_DAYS = 28.0' custom_components/dummy_os_data/forecast.py
          grep -F 'NATIVE_PUBLIC_SLOTS = 288' custom_components/dummy_os_data/planner_hours.py
          grep -F 'PLANNER_HOUR_COUNT = 72' custom_components/dummy_os_data/planner_hours.py
          grep -F 'QUARTERS_PER_HOUR = 4' custom_components/dummy_os_data/planner_hours.py
          grep -F '"padding_used": False' custom_components/dummy_os_data/planner_hours.py
          grep -F '"second_forecast_architecture": False' custom_components/dummy_os_data/planner_hours.py
          grep -F '_attr_unique_id = "do_energy_forecast_planner_hours"' custom_components/dummy_os_data/sensor.py
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Build package
        run: |
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          cat "$CHECKSUM_NAME"
      - name: Create tag and pre-release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          git tag "$VERSION" "$RELEASE_COMMIT"
          git push origin "$VERSION"
          gh release create "$VERSION" "$ZIP_NAME" "$CHECKSUM_NAME" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES.md --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-os-forecast-alpha12-25-published-assets
          path: |
            Dummy_OS_Forecast_0.1.0-alpha.12.25_HA_install.zip
            SHA256SUMS-alpha12.25.txt
            RELEASE_NOTES.md
