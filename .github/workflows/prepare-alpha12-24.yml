name: Prepare Dummy OS Forecast alpha.12.24

on:
  push:
    branches:
      - release-alpha12-24-step13-health
    paths:
      - .github/workflows/prepare-alpha12-24.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-alpha12-24-step13-health
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release metadata
        run: python .github/scripts/prepare_alpha12_24.py
      - name: Test full repository and release gates
        run: |
          python -m pip install --upgrade pytest
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.1.0-alpha.12.24"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.1.0-alpha.12.24"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.1.0-alpha.12.24`' RELEASE_NOTES.md
          grep -F 'READINESS_ALGORITHM_VERSION = "model_health_readiness_v1"' custom_components/dummy_os_data/model_health.py
          grep -F 'MODEL_HEALTH_CONTRACT_VERSION = 2' custom_components/dummy_os_data/model_health.py
          grep -F 'return "profile_unclassified"' custom_components/dummy_os_data/sensor.py
          grep -F 'FORECAST_HORIZON_HOURS = 72' custom_components/dummy_os_data/const.py
          grep -F 'FORECAST_SLOTS = 288' custom_components/dummy_os_data/const.py
          grep -F 'RECENCY_HALF_LIFE_DAYS = 28.0' custom_components/dummy_os_data/forecast.py
          test "$(git diff 0.1.0-alpha.12.23 -- custom_components/dummy_os_data/forecast.py | wc -l)" -eq 0
      - name: Commit release metadata and remove temporary files
        run: |
          git config user.name "Stefan"
          git config user.email "111599445+bliek79@users.noreply.github.com"
          git add custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json RELEASE_NOTES.md
          git rm .github/scripts/prepare_alpha12_24.py .github/workflows/prepare-alpha12-24.yml
          git commit -m "Release alpha.12.24: Step 13 Model Health readiness"
          git push origin HEAD:release-alpha12-24-step13-health
