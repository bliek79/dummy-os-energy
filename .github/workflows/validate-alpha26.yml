name: Validate Alpha 28 release contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile sources
        run: python -m compileall -q custom_components/dummy_os_data tests
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Validate manifest
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify release version consistency
        run: |
          python - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path
          root = Path('custom_components/dummy_os_data')
          tree = ast.parse((root/'const.py').read_text(encoding='utf-8'))
          version = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == 'VERSION' for target in node.targets)
          )
          manifest_version = json.loads((root/'manifest.json').read_text(encoding='utf-8'))['version']
          assert version == manifest_version
          assert re.fullmatch(r'\d+\.\d+\.\d+-alpha\.\d+', version)
          PY
      - name: Verify native forecast architecture contract
        run: |
          grep -F 'QUARTER_MINUTES = 15' custom_components/dummy_os_data/const.py
          grep -F 'FORECAST_HORIZON_HOURS = 72' custom_components/dummy_os_data/const.py
          grep -F 'PLATFORMS = ["sensor", "select"]' custom_components/dummy_os_data/const.py
      - name: Verify forecast-only boundary
        run: |
          python -m pytest -q tests/test_alpha36_forecast_only_scope.py
