name: Validate alpha.26 manual plan controls

on:
  pull_request:
    branches: [main]
  push:
    branches: [alpha26-manual-plan-controls]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile sources
        run: python -m compileall -q custom_components/dummy_os_data tests
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Validate manifest
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify alpha.26 release and architecture contract
        run: |
          grep -F 'VERSION = "0.2.0-alpha.26"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.26"' custom_components/dummy_os_data/manifest.json
          grep -F 'QUARTER_MINUTES = 15' custom_components/dummy_os_data/const.py
          grep -F 'FORECAST_HORIZON_HOURS = 72' custom_components/dummy_os_data/const.py
          grep -F 'PLATFORMS = ["sensor", "select", "binary_sensor", "switch", "datetime", "number"]' custom_components/dummy_os_data/const.py
