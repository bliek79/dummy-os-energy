name: Prepare alpha.18 release consistency

on:
  push:
    branches: [release-alpha18]
    paths: [.github/workflows/prepare-alpha18-test-version.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-alpha18
      - name: Align release consistency test and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_release_consistency.py')
          text = p.read_text()
          old = 'VERSION = "0.2.0-alpha.17"'
          new = 'VERSION = "0.2.0-alpha.18"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one {old!r}, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/prepare-alpha18-test-version.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Align alpha.18 release consistency metadata'
          git push origin HEAD:release-alpha18
