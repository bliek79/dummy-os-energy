name: Restore release consistency gate for alpha.12.19

on:
  push:
    branches:
      - energy-step9-profile-contract-v1
    paths:
      - .github/workflows/restore-release-consistency.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: energy-step9-profile-contract-v1
          fetch-depth: 0
      - name: Restore complete gate from main and update release version
        run: |
          git fetch origin main
          git show origin/main:tests/test_release_consistency.py > tests/test_release_consistency.py
          sed -i 's/Release metadata and alpha\.12\.8 naming\/registry consistency checks\./Release metadata and alpha.12.19 naming\/registry consistency checks./' tests/test_release_consistency.py
          sed -i 's/VERSION = "0.1.0-alpha.12.18"/VERSION = "0.1.0-alpha.12.19"/' tests/test_release_consistency.py
      - name: Commit restored gate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_release_consistency.py
          git commit -m 'Restore complete alpha.12.19 release consistency gate'
          git push origin HEAD:energy-step9-profile-contract-v1
