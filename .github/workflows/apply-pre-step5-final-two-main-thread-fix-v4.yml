name: Apply pre-Step5 final two main-thread fixes v4

on:
  push:
    branches:
      - pre-step5-final-two-main-thread-fix
    paths:
      - .github/workflows/apply-pre-step5-final-two-main-thread-fix-v4.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-step5-final-two-main-thread-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Apply targeted fix
        run: |
          python .github/scripts/apply_alpha9_final_two_fix.py
          python .github/scripts/update_alpha9_release_test_contract.py
      - name: Validate targeted fix
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.9"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.9"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.9`' RELEASE_NOTES_0.2.0-alpha.9.md
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Commit targeted fix
        run: |
          rm -f .github/workflows/apply-pre-step5-final-two-main-thread-fix.yml
          rm -f .github/workflows/apply-pre-step5-final-two-main-thread-fix-v2.yml
          rm -f .github/workflows/apply-pre-step5-final-two-main-thread-fix-v3.yml
          rm -f .github/workflows/apply-pre-step5-final-two-main-thread-fix-v4.yml
          rm -f .github/scripts/apply_alpha9_final_two_fix.py
          rm -f .github/scripts/update_alpha9_release_test_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move final coverage and peak learning calculations off main thread"
          git push origin HEAD:pre-step5-final-two-main-thread-fix
