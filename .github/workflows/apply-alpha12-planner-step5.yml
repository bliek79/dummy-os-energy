name: Apply Planner Step 5 do_plan_72h

on:
  push:
    branches:
      - planner-step5-do-plan-72h
    paths:
      - .github/workflows/apply-alpha12-planner-step5.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planner-step5-do-plan-72h
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Apply Planner Step 5 implementation
        run: |
          python .github/scripts/apply_alpha12_planner_step5.py
          python .github/scripts/fix_alpha12_test_import.py
      - name: Validate Planner Step 5
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.12"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.12"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.12`' RELEASE_NOTES_0.2.0-alpha.12.md
          grep -F '"physical_execution_authority": False' custom_components/dummy_os_data/do_plan_72h.py
          grep -F '"plan_store_write": False' custom_components/dummy_os_data/do_plan_72h.py
          grep -F '"scheduler_invoked": False' custom_components/dummy_os_data/do_plan_72h.py
          grep -F '"service_calls_performed": False' custom_components/dummy_os_data/do_plan_72h.py
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Commit Planner Step 5
        run: |
          rm .github/workflows/apply-alpha12-planner-step5.yml
          rm .github/scripts/apply_alpha12_planner_step5.py
          rm .github/scripts/fix_alpha12_test_import.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement observer-only Planner Step 5 72h simulation"
          git push origin HEAD:planner-step5-do-plan-72h
