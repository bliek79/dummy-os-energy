name: Prepare Dummy OS Energy 0.2.0-alpha.6

on:
  push:
    branches:
      - publish-0.2.0-alpha.6
    paths:
      - .github/workflows/prepare-0.2.0-alpha.6.yml
      - .github/alpha6-trigger.txt

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-0.2.0-alpha.6
          fetch-depth: 0
      - name: Update release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import json
          version = '0.2.0-alpha.6'
          p = Path('custom_components/dummy_os_data/const.py')
          p.write_text(p.read_text().replace('VERSION = "0.2.0-alpha.5"', f'VERSION = "{version}"', 1))
          p = Path('custom_components/dummy_os_data/manifest.json')
          manifest = json.loads(p.read_text())
          manifest['version'] = version
          p.write_text(json.dumps(manifest, indent=2) + '\n')
          p = Path('tests/test_release_consistency.py')
          p.write_text(p.read_text().replace('VERSION = "0.2.0-alpha.5"', f'VERSION = "{version}"', 1))
          notes = base64.b64decode('').decode('utf-8')
          Path('RELEASE_NOTES_0.2.0-alpha.6.md').write_text(notes)
          p = Path('RELEASE_NOTES.md')
          p.write_text(notes + '\n---\n' + p.read_text())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_release_consistency.py RELEASE_NOTES.md RELEASE_NOTES_0.2.0-alpha.6.md
          git commit -m "Prepare 0.2.0-alpha.6 release metadata"
          git push origin HEAD:publish-0.2.0-alpha.6
