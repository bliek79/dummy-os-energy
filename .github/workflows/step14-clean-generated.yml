name: Step 14 clean generated files

on:
  push:
    branches:
      - step14-exact-72-planner-hours
    paths:
      - .github/workflows/step14-clean-generated.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step14-exact-72-planner-hours
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove generated tracked bytecode
        run: |
          git rm -r --ignore-unmatch custom_components/dummy_os_data/__pycache__
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
      - name: Revalidate feature without repository bytecode
        run: |
          python -m pip install --upgrade pytest
          python -m pytest -q
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Commit cleanup
        run: |
          git config user.name "Stefan"
          git config user.email "111599445+bliek79@users.noreply.github.com"
          git rm .github/workflows/step14-clean-generated.yml
          git commit -m "Cleanup Step 14 generated bytecode"
          git push origin HEAD:step14-exact-72-planner-hours
