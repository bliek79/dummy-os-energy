name: Prepare DO Plan Step 2 alpha3

on:
  push:
    branches:
      - do-plan-step2-energy-need
    paths:
      - .github/workflows/prepare-do-plan-step2-alpha3.yml
      - .github/scripts/prepare_do_plan_step2_alpha3.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-plan-step2-energy-need
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted Step 2 integration patches
        run: python .github/scripts/prepare_do_plan_step2_alpha3.py
      - name: Remove temporary preparer
        run: git rm .github/workflows/prepare-do-plan-step2-alpha3.yml .github/scripts/prepare_do_plan_step2_alpha3.py
      - name: Compile and test
        run: |
          python -m pip install --upgrade pytest
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Commit prepared Planner Step 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dummy_os_data/sensor.py custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_release_consistency.py RELEASE_NOTES.md
          git commit -m "Integrate observer-only DO Plan Energy Need alpha3"
          git push origin HEAD:do-plan-step2-energy-need
