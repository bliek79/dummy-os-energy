name: Prepare Dummy OS Energy 0.2.0-alpha.7

on:
  push:
    branches:
      - publish-0.2.0-alpha.7
    paths:
      - .github/workflows/prepare-0.2.0-alpha.7.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-0.2.0-alpha.7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          version = "0.2.0-alpha.7"
          previous = "0.2.0-alpha.6"

          p = Path("custom_components/dummy_os_data/const.py")
          text = p.read_text()
          if f'VERSION = "{previous}"' not in text:
              raise SystemExit("expected previous const version not found")
          p.write_text(text.replace(f'VERSION = "{previous}"', f'VERSION = "{version}"', 1))

          p = Path("custom_components/dummy_os_data/manifest.json")
          manifest = json.loads(p.read_text())
          if manifest.get("version") != previous:
              raise SystemExit(f"unexpected manifest version: {manifest.get('version')}")
          manifest["version"] = version
          p.write_text(json.dumps(manifest, indent=2) + "\n")

          p = Path("tests/test_release_consistency.py")
          text = p.read_text()
          if f'VERSION = "{previous}"' not in text:
              raise SystemExit("expected previous test version not found")
          p.write_text(text.replace(f'VERSION = "{previous}"', f'VERSION = "{version}"', 1))

          notes = '''# GitHub Release

**Tag:** `0.2.0-alpha.7`  
**Release title:** Dummy OS Energy 0.2.0-alpha.7 - Planner Main-Thread Performance Fix

## Dummy OS Energy 0.2.0-alpha.7

Deze pre-release publiceert uitsluitend de reeds gemergede vervolgfix na de live-validatie van 0.2.0-alpha.6. Planner Stap 5 wordt niet toegevoegd.

### Opgelost
- Verplaatst de resterende zware berekeningen van de planner-, contract- en model-healthketen van de Home Assistant main thread naar executor-backed achtergrondberekening.
- Past dit cachepatroon toe op Forecast Planner Hours, Forecast Planner Contract, DO Plan Input 72h, DO Plan Energy Need, DO Plan Reserve SOC, DO Plan Preview en Forecast Model Health.
- `native_value` en `extra_state_attributes` lezen alleen het laatst voltooide cache-resultaat in plaats van de volledige geneste plannerketen synchroon opnieuw op te bouwen.
- Invoer wordt op de Home Assistant main thread als snapshot vastgelegd; de pure rekenstap draait via `hass.async_add_executor_job(...)`.
- Overlappende refreshes worden samengevoegd met een pending-flag om onnodige parallelle herberekeningen te voorkomen.
- Tijdens de eerste berekening kan tijdelijk fail-safe `initializing` zichtbaar zijn met blocker `planner_calculation_pending` of `model_health_calculation_pending`.

### Bewust ongewijzigd
- native forecastarchitectuur blijft 15 minuten / 72 uur / exact 288 slots;
- Planner Stap 1 t/m 4 blijven inhoudelijk en functioneel ongewijzigd;
- plannerformules, reserve-/SOC-logica, prijs-/solarcontracten en entity-identiteiten zijn niet gewijzigd;
- geen Planner Stap 5-functionaliteit;
- geen Plan Store, Scheduler, Bridge, Safety of fysieke execution-takeover;
- `shadow_only=true`, `active_use_permitted=false` en `physical_execution_authority=false` blijven leidend;
- cross-sensor hergebruik wordt nog niet centraal gedeeld; eerst live meten of deze gerichte fix voldoende is.

### Live-validatie na installatie
Na installatie via HACS en een volledige Home Assistant-herstart moet worden gecontroleerd dat:
- de eerdere startup-main-threadwaarschuwingen voor Forecast Planner Hours (~0,475 s), Forecast Planner Contract (~1,368 s), DO Plan Input 72h (~1,193 s), DO Plan Energy Need (~1,524 s), DO Plan Reserve SOC (~1,765 s), DO Plan Preview (~3,573 s) en Forecast Model Health (~0,707 s) niet terugkomen als blokkerende/synchrone waarschuwingen;
- Planner Stap 1 t/m 4 dezelfde observer-only uitkomsten blijven geven;
- `shadow_only=true`, `active_use_permitted=false` en `physical_execution_authority=false` behouden blijven;
- geen nieuwe regressies in de startup-log zichtbaar zijn.

Planner Stap 5 blijft geparkeerd totdat deze performance-gate live is geslaagd.
'''

          standalone = Path(f"RELEASE_NOTES_{version}.md")
          standalone.write_text(notes)

          history = Path("RELEASE_NOTES.md")
          existing = history.read_text()
          marker = f"**Tag:** `{version}`"
          if marker in existing:
              raise SystemExit("alpha.7 release notes already present")
          history.write_text(notes + "\n---\n" + existing)
          PY
      - run: python -m pip install --upgrade pytest
      - name: Validate prepared release
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.7"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.7"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.7`' RELEASE_NOTES_0.2.0-alpha.7.md
          python - <<'PY'
          from pathlib import Path
          sensor = Path('custom_components/dummy_os_data/sensor.py').read_text()
          preview = Path('custom_components/dummy_os_data/do_plan_preview_sensor.py').read_text()
          assert 'class DummyOSAsyncPlannerResultSensor' in sensor
          assert 'async_add_executor_job' in sensor
          assert 'planner_calculation_pending' in sensor
          assert 'model_health_calculation_pending' in sensor
          assert 'async_add_executor_job' in preview
          PY
          grep -F '"physical_execution_authority": False' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"shadow_only": True' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"active_use_permitted": False' custom_components/dummy_os_data/do_plan_preview.py
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Commit prepared release metadata
        run: |
          rm .github/workflows/prepare-0.2.0-alpha.7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_release_consistency.py RELEASE_NOTES.md RELEASE_NOTES_0.2.0-alpha.7.md .github/workflows/prepare-0.2.0-alpha.7.yml
          git commit -m "Prepare 0.2.0-alpha.7 release metadata"
          git push origin HEAD:publish-0.2.0-alpha.7
