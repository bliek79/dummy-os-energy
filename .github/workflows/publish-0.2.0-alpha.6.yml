name: Publish Dummy OS Energy 0.2.0-alpha.6

# One-shot publisher for the explicitly approved pre-Step-5 health-fix release.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0.2.0-alpha.6.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
      VERSION: 0.2.0-alpha.6
      ZIP_NAME: Dummy_OS_Energy_0.2.0-alpha.6_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-0.2.0-alpha.6.txt
      RELEASE_TITLE: Dummy OS Energy 0.2.0-alpha.6 - Pre-Step-5 Health Fix
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile and test
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify pre-Step-5 health fix invariants
        run: |
          grep -F 'VERSION = "0.2.0-alpha.6"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.6"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.6`' RELEASE_NOTES_0.2.0-alpha.6.md
          python - <<'PY'
          from pathlib import Path
          forecast = Path('custom_components/dummy_os_data/forecast.py').read_text()
          profile = forecast.split('def profile_statistics',1)[1].split('def all_profile_statistics',1)[0]
          build = forecast.split('def build(',1)[1].split('def average_confidence',1)[0]
          assert 'slot_count < 1' not in profile
          assert 'slot_count < 1 or slot_count > MAX_INTERNAL_FORECAST_SLOTS' in build
          home = Path('custom_components/dummy_os_data/home_input_sensor.py').read_text()
          assert home.count('async_add_executor_job') >= 2
          sensor = Path('custom_components/dummy_os_data/sensor.py').read_text()
          recency = sensor.split('class DummyOSEnergyRecencyWeightingSensor',1)[1].split('class DummyOSEnergyPeakLearningSensor',1)[0]
          assert 'async_add_executor_job' in recency
          PY
          grep -F '"physical_execution_authority": False' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"shadow_only": True' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"active_use_permitted": False' custom_components/dummy_os_data/do_plan_preview.py
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Build package
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          cat "$CHECKSUM_NAME"
      - name: Create tag and pre-release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          git tag "$VERSION" "$RELEASE_COMMIT"
          git push origin "$VERSION"
          gh release create "$VERSION" "$ZIP_NAME" "$CHECKSUM_NAME" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES_0.2.0-alpha.6.md --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-os-energy-0.2.0-alpha.6-published-assets
          path: |
            Dummy_OS_Energy_0.2.0-alpha.6_HA_install.zip
            SHA256SUMS-0.2.0-alpha.6.txt
            RELEASE_NOTES_0.2.0-alpha.6.md
