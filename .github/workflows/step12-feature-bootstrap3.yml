name: Step 12 feature bootstrap retry 2

on:
  push:
    branches:
      - step12-horizon-quality-observer
    paths:
      - .github/workflows/step12-feature-bootstrap3.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step12-horizon-quality-observer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Step 12 patch
        run: python .github/scripts/step12_bootstrap_v2.py
      - name: Test full repository
        run: |
          python -m pip install --upgrade pytest
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          test ! -d custom_components/dummy_os_data/__pycache__
          test ! -d tests/__pycache__
      - name: Commit feature and remove temporary bootstrap files
        run: |
          rm .github/workflows/step12-feature-bootstrap.yml
          rm .github/workflows/step12-feature-bootstrap2.yml
          rm .github/workflows/step12-feature-bootstrap3.yml
          rm .github/scripts/step12_bootstrap.py
          rm .github/scripts/step12_bootstrap_v2.py
          git config user.name "Stefan"
          git config user.email "111599445+bliek79@users.noreply.github.com"
          git add custom_components/dummy_os_data tests .github
          git commit -m "Step 12: integrate horizon quality observer"
          git push origin HEAD:step12-horizon-quality-observer
