name: Apply pre-Step5 Time Windows main-thread fix

on:
  push:
    branches:
      - pre-step5-time-windows-main-thread-fix
    paths:
      - .github/workflows/apply-pre-step5-time-windows-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-step5-time-windows-main-thread-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Apply targeted Time Windows fix
        run: python .github/scripts/apply_alpha10_time_windows_fix.py
      - name: Validate targeted fix
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.10"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.10"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.10`' RELEASE_NOTES_0.2.0-alpha.10.md
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Commit targeted fix
        run: |
          rm .github/workflows/apply-pre-step5-time-windows-fix.yml
          rm .github/scripts/apply_alpha10_time_windows_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move Time Windows calculation off main thread"
          git push origin HEAD:pre-step5-time-windows-main-thread-fix
