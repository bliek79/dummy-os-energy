name: Apply pre-Step-5 health fix

on:
  push:
    branches:
      - pre-step5-health-fix
    paths:
      - .github/workflows/apply-pre-step5-health-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-step5-health-fix
          fetch-depth: 0
      - name: Apply targeted startup and observer fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('custom_components/dummy_os_data/forecast.py')
          text = path.read_text()
          bad = '''    def profile_statistics(self, profile: str) -> dict[str, Any]:\n        """Return compact historical statistics for one profile."""\n        if slot_count < 1 or slot_count > MAX_INTERNAL_FORECAST_SLOTS:\n            raise ValueError(\n                f"slot_count must be between 1 and {MAX_INTERNAL_FORECAST_SLOTS}"\n            )\n\n        exact, day_type, quarter, all_values = self._history(profile)\n'''
          good = '''    def profile_statistics(self, profile: str) -> dict[str, Any]:\n        """Return compact historical statistics for one profile."""\n        exact, day_type, quarter, all_values = self._history(profile)\n'''
          if bad not in text:
              raise SystemExit('forecast.py profile_statistics marker not found')
          text = text.replace(bad, good, 1)
          build_marker = '''        Non-learnable profile contexts deliberately produce the same 288-slot\n        time contract with unavailable values. This preserves planner-facing\n        shape without silently borrowing Normal or Away history.\n        """\n        exact, day_type, quarter, all_values = self._history(profile)\n'''
          build_replacement = '''        Non-learnable profile contexts deliberately produce the same 288-slot\n        time contract with unavailable values. This preserves planner-facing\n        shape without silently borrowing Normal or Away history.\n        """\n        if slot_count < 1 or slot_count > MAX_INTERNAL_FORECAST_SLOTS:\n            raise ValueError(\n                f"slot_count must be between 1 and {MAX_INTERNAL_FORECAST_SLOTS}"\n            )\n\n        exact, day_type, quarter, all_values = self._history(profile)\n'''
          if build_marker not in text:
              raise SystemExit('forecast.py build marker not found')
          path.write_text(text.replace(build_marker, build_replacement, 1))

          path = Path('custom_components/dummy_os_data/home_input_sensor.py')
          text = path.read_text()
          fallback_class = '''class DummyOSEnergyFallbackHierarchySensor(SensorEntity):\n    """Observer-only Step 10 Energy fallback-hierarchy diagnostics."""\n\n    _attr_should_poll = False\n    _attr_has_entity_name = False\n    _attr_name = "DO Energy Fallback Hierarchy"\n    _attr_unique_id = "do_energy_fallback_hierarchy"\n    _attr_suggested_object_id = "do_energy_fallback_hierarchy"\n    _attr_icon = "mdi:call-split"\n    _unrecorded_attributes = frozenset(\n        {"per_level_metrics", "day_type_daypart_metrics", "early_late_metrics"}\n    )\n\n    def __init__(self, coordinator: DummyOSHomeDataCoordinator) -> None:\n        self.coordinator = coordinator\n        self._remove_listener = None\n        self._cached_result: dict[str, Any] | None = None\n        self._refresh_task = None\n        self._refresh_pending = False\n\n    @property\n    def device_info(self) -> DeviceInfo:\n        return DeviceInfo(identifiers={(DOMAIN, "main")}, name=NAME, manufacturer="Dummy OS", model="Forecast Platform", sw_version=VERSION)\n\n    async def async_added_to_hass(self) -> None:\n        await super().async_added_to_hass()\n        self._remove_listener = self.coordinator.async_add_listener(self._handle_update)\n        self._schedule_refresh()\n\n    async def async_will_remove_from_hass(self) -> None:\n        if self._remove_listener is not None:\n            self._remove_listener()\n        if self._refresh_task is not None and not self._refresh_task.done():\n            self._refresh_task.cancel()\n        await super().async_will_remove_from_hass()\n\n    @callback\n    def _handle_update(self) -> None:\n        self._schedule_refresh()\n\n    @callback\n    def _schedule_refresh(self) -> None:\n        if self._refresh_task is not None and not self._refresh_task.done():\n            self._refresh_pending = True\n            return\n        self._refresh_task = self.hass.async_create_task(self._async_refresh_result())\n\n    async def _async_refresh_result(self) -> None:\n        while True:\n            self._refresh_pending = False\n            result = await self.hass.async_add_executor_job(self._calculate_result)\n            self._cached_result = result\n            self.async_write_ha_state()\n            if not self._refresh_pending:\n                return\n\n    def _calculate_result(self) -> dict[str, Any]:\n        if self.coordinator.profile not in PROFILE_LEARNING_OPTIONS:\n            return {"schema_version": 1, "algorithm_version": "fallback_hierarchy_observer_v1", "status": "inactive_profile", "profile": self.coordinator.profile, "observer_only": True, "forecast_influence_enabled": False, "native_resolution_minutes": 15, "production_model": "historical_baseline", "production_model_version": "0.4", "control_recency_half_life_days": 28.0, "control_hierarchy": ["weekday_quarter", "day_type_quarter", "quarter_of_day", "profile_mean"], "candidate_hierarchy": ["weekday_quarter", "day_type_quarter", "nearby_quarter_day_type", "same_hour_profile", "daypart_profile", "profile_global_median"], "evaluation_count": 0, "distinct_local_days": 0, "eligible_level_shadow_count": 0, "hierarchy_changed_selection_count": 0, "fallback_activation_counts": {}, "excluded_record_counts": {}, "control_metrics": {}, "candidate_metrics": {}, "per_level_metrics": {}, "day_type_daypart_metrics": {}, "early_late_metrics": {}, "preferred_candidate_hierarchy": ["weekday_quarter", "day_type_quarter", "nearby_quarter_day_type", "same_hour_profile", "daypart_profile", "profile_global_median"], "replay_candidate_supported": False, "promotion_ready": False, "live_shadow_required": True, "blockers": ["profile_unclassified"], "promotion_blockers": ["profile_unclassified", "live_shadow_required"], "calibration_fingerprint": None}\n        return calculate_fallback_hierarchy(self.coordinator.records, self.coordinator.evaluations, self.coordinator.profile, dt_util.as_local)\n\n    def _result(self) -> dict[str, Any]:\n        return self._cached_result or {"status": "initializing", "profile": self.coordinator.profile, "observer_only": True, "forecast_influence_enabled": False, "blockers": ["observer_calculation_pending"]}\n\n    @property\n    def native_value(self) -> str:\n        return str(self._result()["status"])\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        return dict(self._result())\n'''
          meaningful_class = '''class DummyOSEnergyMeaningfulConfidenceSensor(SensorEntity):\n    """Observer-only Step 11 meaningful-confidence diagnostics."""\n\n    _attr_should_poll = False\n    _attr_has_entity_name = False\n    _attr_name = "DO Energy Meaningful Confidence"\n    _attr_unique_id = "do_energy_meaningful_confidence"\n    _attr_suggested_object_id = "do_energy_meaningful_confidence"\n    _attr_icon = "mdi:gauge"\n    _unrecorded_attributes = frozenset({"production_buckets", "candidate_buckets"})\n\n    def __init__(self, coordinator: DummyOSHomeDataCoordinator) -> None:\n        self.coordinator = coordinator\n        self._remove_listener = None\n        self._cached_result: dict[str, Any] | None = None\n        self._refresh_task = None\n        self._refresh_pending = False\n\n    @property\n    def device_info(self) -> DeviceInfo:\n        return DeviceInfo(identifiers={(DOMAIN, "main")}, name=NAME, manufacturer="Dummy OS", model="Forecast Platform", sw_version=VERSION)\n\n    async def async_added_to_hass(self) -> None:\n        await super().async_added_to_hass()\n        self._remove_listener = self.coordinator.async_add_listener(self._handle_update)\n        self._schedule_refresh()\n\n    async def async_will_remove_from_hass(self) -> None:\n        if self._remove_listener is not None:\n            self._remove_listener()\n        if self._refresh_task is not None and not self._refresh_task.done():\n            self._refresh_task.cancel()\n        await super().async_will_remove_from_hass()\n\n    @callback\n    def _handle_update(self) -> None:\n        self._schedule_refresh()\n\n    @callback\n    def _schedule_refresh(self) -> None:\n        if self._refresh_task is not None and not self._refresh_task.done():\n            self._refresh_pending = True\n            return\n        self._refresh_task = self.hass.async_create_task(self._async_refresh_result())\n\n    async def _async_refresh_result(self) -> None:\n        while True:\n            self._refresh_pending = False\n            result = await self.hass.async_add_executor_job(self._calculate_result)\n            self._cached_result = result\n            self.async_write_ha_state()\n            if not self._refresh_pending:\n                return\n\n    def _calculate_result(self) -> dict[str, Any]:\n        return calculate_meaningful_confidence(self.coordinator.records, self.coordinator.evaluations, self.coordinator.profile, dt_util.as_local)\n\n    def _result(self) -> dict[str, Any]:\n        return self._cached_result or {"status": "initializing", "profile": self.coordinator.profile, "observer_only": True, "forecast_influence_enabled": False, "blockers": ["observer_calculation_pending"]}\n\n    @property\n    def native_value(self) -> str:\n        return str(self._result()["status"])\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        return dict(self._result())\n'''
          pattern = re.compile(r'class DummyOSEnergyFallbackHierarchySensor\(SensorEntity\):.*?(?=\n\nclass DummyOSEnergyMeaningfulConfidenceSensor\(SensorEntity\):)', re.S)
          text, count = pattern.subn(fallback_class.rstrip(), text, count=1)
          if count != 1: raise SystemExit('fallback class replacement failed')
          pattern = re.compile(r'class DummyOSEnergyMeaningfulConfidenceSensor\(SensorEntity\):.*?(?=\n\nclass DummyOSEnergyForecastQualityByHorizonSensor\(SensorEntity\):)', re.S)
          text, count = pattern.subn(meaningful_class.rstrip(), text, count=1)
          if count != 1: raise SystemExit('meaningful class replacement failed')
          path.write_text(text)

          path = Path('custom_components/dummy_os_data/sensor.py')
          text = path.read_text()
          recency_class = '''class DummyOSEnergyRecencyWeightingSensor(DummyOSBaseSensor):\n    """Observer-only Step 8A Energy recency-weighting diagnostics."""\n\n    _attr_name = "DO Energy Recency Weighting"\n    _attr_unique_id = "do_energy_recency_weighting"\n    _attr_suggested_object_id = "do_energy_recency_weighting"\n    _attr_icon = "mdi:timeline-clock-outline"\n    _unrecorded_attributes = frozenset({"per_candidate_metrics", "segment_metrics", "early_late_metrics"})\n\n    def __init__(self, coordinator: DummyOSHomeDataCoordinator) -> None:\n        super().__init__(coordinator)\n        self._cached_result: dict[str, Any] | None = None\n        self._refresh_task = None\n        self._refresh_pending = False\n\n    @property\n    def name(self) -> str:\n        return "DO Energy Recency Weighting"\n\n    async def async_added_to_hass(self) -> None:\n        await super().async_added_to_hass()\n        self._schedule_refresh()\n\n    async def async_will_remove_from_hass(self) -> None:\n        if self._refresh_task is not None and not self._refresh_task.done():\n            self._refresh_task.cancel()\n        await super().async_will_remove_from_hass()\n\n    @callback\n    def _handle_update(self) -> None:\n        self._schedule_refresh()\n\n    @callback\n    def _schedule_refresh(self) -> None:\n        if self._refresh_task is not None and not self._refresh_task.done():\n            self._refresh_pending = True\n            return\n        self._refresh_task = self.hass.async_create_task(self._async_refresh_result())\n\n    async def _async_refresh_result(self) -> None:\n        while True:\n            self._refresh_pending = False\n            result = await self.hass.async_add_executor_job(self._calculate_result)\n            self._cached_result = result\n            self.async_write_ha_state()\n            if not self._refresh_pending:\n                return\n\n    def _calculate_result(self) -> dict[str, Any]:\n        if not self._profile_learnable:\n            return {"schema_version": "8a.1", "algorithm_version": "recency_weighting_observer_v1", "status": "blocked", "profile": self.coordinator.profile, "observer_only": True, "forecast_influence_enabled": False, "promotion_ready": False, "blockers": ["profile_unclassified"]}\n        return calculate_recency_weighting(self.coordinator.records, self.coordinator.evaluations, self.coordinator.profile, dt_util.as_local)\n\n    def _result(self) -> dict[str, Any]:\n        return self._cached_result or {"schema_version": "8a.1", "algorithm_version": "recency_weighting_observer_v1", "status": "initializing", "profile": self.coordinator.profile, "observer_only": True, "forecast_influence_enabled": False, "promotion_ready": False, "blockers": ["observer_calculation_pending"]}\n\n    @property\n    def native_value(self) -> str:\n        return str(self._result()["status"])\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        return dict(self._result())\n'''
          pattern = re.compile(r'class DummyOSEnergyRecencyWeightingSensor\(DummyOSBaseSensor\):.*?(?=\n\nclass DummyOSEnergyPeakLearningSensor\(DummyOSBaseSensor\):)', re.S)
          text, count = pattern.subn(recency_class.rstrip(), text, count=1)
          if count != 1: raise SystemExit('recency class replacement failed')
          path.write_text(text)

          Path('tests/test_pre_step5_health_fix.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).parents[1]\n\ndef test_slot_count_validation_location() -> None:\n    source = (ROOT / "custom_components/dummy_os_data/forecast.py").read_text()\n    profile_block = source.split("def profile_statistics", 1)[1].split("def all_profile_statistics", 1)[0]\n    build_block = source.split("def build(", 1)[1].split("def average_confidence", 1)[0]\n    assert "slot_count < 1" not in profile_block\n    assert "slot_count < 1 or slot_count > MAX_INTERNAL_FORECAST_SLOTS" in build_block\n\ndef test_heavy_observers_are_executor_backed() -> None:\n    home = (ROOT / "custom_components/dummy_os_data/home_input_sensor.py").read_text()\n    assert home.count("async_add_executor_job(self._calculate_result)") >= 2\n    sensor = (ROOT / "custom_components/dummy_os_data/sensor.py").read_text()\n    block = sensor.split("class DummyOSEnergyRecencyWeightingSensor", 1)[1].split("class DummyOSEnergyPeakLearningSensor", 1)[0]\n    assert "async_add_executor_job(self._calculate_result)" in block\n    assert "observer_calculation_pending" in home\n    assert "observer_calculation_pending" in block\n''')
          PY
      - name: Validate patched sources
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dummy_os_data/forecast.py custom_components/dummy_os_data/home_input_sensor.py custom_components/dummy_os_data/sensor.py tests/test_pre_step5_health_fix.py
          git commit -m "Fix forecast startup and offload heavy observers"
          git push origin HEAD:pre-step5-health-fix
