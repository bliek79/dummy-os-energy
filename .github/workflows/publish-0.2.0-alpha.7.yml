name: Publish Dummy OS Energy 0.2.0-alpha.7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0.2.0-alpha.7.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
      VERSION: 0.2.0-alpha.7
      ZIP_NAME: Dummy_OS_Energy_0.2.0-alpha.7_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-0.2.0-alpha.7.txt
      RELEASE_TITLE: Dummy OS Energy 0.2.0-alpha.7 - Planner Main-Thread Performance Fix
      GH_TOKEN: ${{ github.token }}
      RELEASE_NOTES_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare alpha.7 metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import json
          version = '0.2.0-alpha.7'
          previous = '0.2.0-alpha.6'
          p = Path('custom_components/dummy_os_data/const.py')
          p.write_text(p.read_text().replace(f'VERSION = "{previous}"', f'VERSION = "{version}"', 1))
          p = Path('custom_components/dummy_os_data/manifest.json')
          manifest = json.loads(p.read_text())
          manifest['version'] = version
          p.write_text(json.dumps(manifest, indent=2) + '\n')
          p = Path('tests/test_release_consistency.py')
          p.write_text(p.read_text().replace(f'VERSION = "{previous}"', f'VERSION = "{version}"', 1))
          notes = base64.b64decode(__import__('os').environ['RELEASE_NOTES_B64']).decode()
          Path(f'RELEASE_NOTES_{version}.md').write_text(notes)
          history = Path('RELEASE_NOTES.md')
          history.write_text(notes + '\n---\n' + history.read_text())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_release_consistency.py RELEASE_NOTES.md RELEASE_NOTES_0.2.0-alpha.7.md
          git commit -m "Publish 0.2.0-alpha.7 metadata"
          git push origin HEAD:main
      - run: python -m pip install --upgrade pytest
      - name: Compile and test release commit
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.7"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.7"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.7`' RELEASE_NOTES_0.2.0-alpha.7.md
          python - <<'PY'
          from pathlib import Path
          sensor = Path('custom_components/dummy_os_data/sensor.py').read_text()
          preview = Path('custom_components/dummy_os_data/do_plan_preview_sensor.py').read_text()
          assert 'class DummyOSAsyncPlannerResultSensor' in sensor
          assert 'async_add_executor_job' in sensor
          assert 'planner_calculation_pending' in sensor
          assert 'model_health_calculation_pending' in sensor
          assert 'async_add_executor_job' in preview
          PY
          grep -F '"physical_execution_authority": False' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"shadow_only": True' custom_components/dummy_os_data/do_plan_preview.py
          grep -F '"active_use_permitted": False' custom_components/dummy_os_data/do_plan_preview.py
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Build package
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          cat "$CHECKSUM_NAME"
      - name: Create tag and pre-release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          git tag "$VERSION" "$RELEASE_COMMIT"
          git push origin "$VERSION"
          gh release create "$VERSION" "$ZIP_NAME" "$CHECKSUM_NAME" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES_0.2.0-alpha.7.md --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-os-energy-0.2.0-alpha.7-published-assets
          path: |
            Dummy_OS_Energy_0.2.0-alpha.7_HA_install.zip
            SHA256SUMS-0.2.0-alpha.7.txt
            RELEASE_NOTES_0.2.0-alpha.7.md
