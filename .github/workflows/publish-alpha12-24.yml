name: Publish Dummy OS Forecast alpha.12.24

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha12-24.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VERSION: 0.1.0-alpha.12.24
      RELEASE_COMMIT: a06eaebb220c72df547018113ab51440ae311cbe
      ZIP_NAME: Dummy_OS_Forecast_0.1.0-alpha.12.24_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-alpha12.24.txt
      RELEASE_TITLE: Dummy OS Forecast 0.1.0-alpha.12.24 - Step 13 Objective Model Health Readiness
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a06eaebb220c72df547018113ab51440ae311cbe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Verify pinned release commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - name: Compile and test
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify Step 13 and production invariants
        run: |
          grep -F 'VERSION = "0.1.0-alpha.12.24"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.1.0-alpha.12.24"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.1.0-alpha.12.24`' RELEASE_NOTES.md
          grep -F 'READINESS_ALGORITHM_VERSION = "model_health_readiness_v1"' custom_components/dummy_os_data/model_health.py
          grep -F 'MODEL_HEALTH_CONTRACT_VERSION = 2' custom_components/dummy_os_data/model_health.py
          grep -F '"runtime_input_status"' custom_components/dummy_os_data/model_health.py
          grep -F '"readiness_blockers"' custom_components/dummy_os_data/model_health.py
          python -c 'import importlib.util; s=importlib.util.spec_from_file_location("c","custom_components/dummy_os_data/const.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert m.FORECAST_SLOTS == 288 and m.FORECAST_HORIZON_HOURS == 72'
          grep -F 'RECENCY_HALF_LIFE_DAYS = 28.0' custom_components/dummy_os_data/forecast.py
          test "$(git diff 0.1.0-alpha.12.23 "$RELEASE_COMMIT" -- custom_components/dummy_os_data/forecast.py | wc -l)" -eq 0
      - name: Build package
        run: |
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          cat "$CHECKSUM_NAME"
      - name: Create tag and pre-release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          git tag "$VERSION" "$RELEASE_COMMIT"
          git push origin "$VERSION"
          gh release create "$VERSION" "$ZIP_NAME" "$CHECKSUM_NAME" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES.md --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-os-forecast-alpha12-24-published-assets
          path: |
            Dummy_OS_Forecast_0.1.0-alpha.12.24_HA_install.zip
            SHA256SUMS-alpha12.24.txt
            RELEASE_NOTES.md
