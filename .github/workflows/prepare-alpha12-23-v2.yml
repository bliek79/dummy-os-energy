name: Prepare Dummy OS Forecast alpha.12.23 v2

on:
  push:
    branches:
      - release-alpha12-23-step12-horizon
    paths:
      - .github/workflows/prepare-alpha12-23-v2.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-alpha12-23-step12-horizon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release metadata
        run: python .github/scripts/prepare_alpha12_23.py
      - name: Test full repository
        run: |
          python -m pip install --upgrade pytest
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          test ! -d custom_components/dummy_os_data/__pycache__
          test ! -d tests/__pycache__
      - name: Commit release metadata and remove temporary files
        run: |
          rm .github/workflows/prepare-alpha12-23.yml
          rm .github/workflows/prepare-alpha12-23-v2.yml
          rm .github/scripts/prepare_alpha12_23.py
          git config user.name "Stefan"
          git config user.email "111599445+bliek79@users.noreply.github.com"
          git add custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_release_consistency.py RELEASE_NOTES.md .github
          git commit -m "Release alpha.12.23: Step 12 horizon quality observer"
          git push origin HEAD:release-alpha12-23-step12-horizon
