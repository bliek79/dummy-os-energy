name: Wire DO Plan Preview sensor

on:
  push:
    branches:
      - do-plan-step4-preview
    paths:
      - .github/workflows/step4-wire-preview.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-plan-step4-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch sensor platform
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('custom_components/dummy_os_data/sensor.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from .do_plan_reserve_soc import build_do_plan_reserve_soc\n'
          import_line = 'from .do_plan_preview_sensor import build_do_plan_preview_sensors\n'
          if import_line not in text:
              assert import_anchor in text
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          setup_anchor = '            DummyOSPlanReserveSOCSensor(coordinator),\n'
          setup_line = '            *build_do_plan_preview_sensors(coordinator),\n'
          if setup_line not in text:
              assert setup_anchor in text
              text = text.replace(setup_anchor, setup_anchor + setup_line, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify exact wiring
        run: |
          grep -F 'from .do_plan_preview_sensor import build_do_plan_preview_sensors' custom_components/dummy_os_data/sensor.py
          grep -F '*build_do_plan_preview_sensors(coordinator),' custom_components/dummy_os_data/sensor.py
          python -m compileall -q custom_components/dummy_os_data tests
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/dummy_os_data/sensor.py
          git commit -m 'Wire observer-only DO Plan Preview sensor'
          git push origin HEAD:do-plan-step4-preview
