name: Prepare alpha.7 metadata PR

on:
  push:
    branches:
      - release-0.2.0-alpha.7-metadata
    paths:
      - .github/workflows/prepare-alpha7-metadata-pr.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_NOTES_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-0.2.0-alpha.7-metadata
          fetch-depth: 0
      - name: Update metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json, os
          version = '0.2.0-alpha.7'
          previous = '0.2.0-alpha.6'
          p = Path('custom_components/dummy_os_data/const.py')
          p.write_text(p.read_text().replace(f'VERSION = "{previous}"', f'VERSION = "{version}"', 1))
          p = Path('custom_components/dummy_os_data/manifest.json')
          m = json.loads(p.read_text()); m['version'] = version; p.write_text(json.dumps(m, indent=2) + '\n')
          p = Path('tests/test_release_consistency.py')
          p.write_text(p.read_text().replace(f'VERSION = "{previous}"', f'VERSION = "{version}"', 1))
          notes = base64.b64decode(os.environ['RELEASE_NOTES_B64']).decode()
          Path('RELEASE_NOTES_0.2.0-alpha.7.md').write_text(notes)
          p = Path('RELEASE_NOTES.md'); p.write_text(notes + '\n---\n' + p.read_text())
          PY
          rm .github/workflows/prepare-alpha7-metadata-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare 0.2.0-alpha.7 release metadata"
          git push origin HEAD:release-0.2.0-alpha.7-metadata
