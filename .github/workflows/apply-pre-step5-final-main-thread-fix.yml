name: Apply pre-Step5 remaining main-thread fix

on:
  push:
    branches:
      - pre-step5-final-main-thread-fix
    paths:
      - .github/workflows/apply-pre-step5-final-main-thread-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-step5-final-main-thread-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted async cache fix and alpha.8 metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing expected block: {label}")
              return text.replace(old, new, 1)

          sensor_path = Path('custom_components/dummy_os_data/sensor.py')
          sensor = sensor_path.read_text()

          marker = '\ndef _build_contract_from_snapshot(snapshot: dict[str, Any]) -> dict[str, Any]:\n'
          helper = '''\ndef _build_public_forecast_from_snapshot(snapshot: dict[str, Any]) -> list[Any]:\n    \"\"\"Build the public 72-hour Energy forecast outside the HA main thread.\"\"\"\n    return HomeBaselineForecast(snapshot[\"records\"]).build(\n        snapshot[\"profile\"], now=snapshot[\"now\"]\n    )\n\n\ndef _build_contract_from_snapshot(snapshot: dict[str, Any]) -> dict[str, Any]:\n'''
          sensor = replace_once(sensor, marker, helper, 'public forecast snapshot helper')

          old_next = '''class DummyOSHomeForecastNextQuarterSensor(DummyOSBaseSensor):\n    _attr_name = \"DO Energy Forecast Next Quarter\"\n    _attr_unique_id = \"do_energy_forecast_next_quarter\"\n    _attr_suggested_object_id = \"do_energy_forecast_next_quarter\"\n    _attr_native_unit_of_measurement = UnitOfEnergy.KILO_WATT_HOUR\n    _attr_device_class = SensorDeviceClass.ENERGY\n    _attr_icon = \"mdi:clock-fast\"\n\n    @property\n    def native_value(self) -> float | None:\n        slots = self._forecast()\n        return slots[0].energy_kwh if slots else None\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        slots = self._forecast()\n        if not slots:\n            return {\"status\": \"unavailable\", \"profile\": self.coordinator.profile}\n        slot = slots[0]\n        return {\n            \"status\": \"ok\" if self._profile_learnable and slot.energy_kwh is not None else (\"profile_unclassified\" if not self._profile_learnable else \"unavailable\"),\n            \"period_start\": slot.start.isoformat(),\n            \"period_end\": slot.end.isoformat(),\n            \"profile\": self.coordinator.profile,\n            \"sample_count\": slot.sample_count,\n            \"source\": slot.source,\n            \"confidence\": slot.confidence,\n        }\n\n\n'''
          new_next = '''class DummyOSHomeForecastNextQuarterSensor(DummyOSAsyncPlannerResultSensor):\n    _attr_name = \"DO Energy Forecast Next Quarter\"\n    _attr_unique_id = \"do_energy_forecast_next_quarter\"\n    _attr_suggested_object_id = \"do_energy_forecast_next_quarter\"\n    _attr_native_unit_of_measurement = UnitOfEnergy.KILO_WATT_HOUR\n    _attr_device_class = SensorDeviceClass.ENERGY\n    _attr_icon = \"mdi:clock-fast\"\n\n    def _calculate_result(self, snapshot: dict[str, Any]) -> dict[str, Any]:\n        slots = _build_public_forecast_from_snapshot(snapshot)\n        if not slots:\n            return {\"value\": None, \"status\": \"unavailable\", \"profile\": snapshot[\"profile\"]}\n        slot = slots[0]\n        learnable = snapshot[\"profile\"] in PROFILE_LEARNING_OPTIONS\n        return {\n            \"value\": slot.energy_kwh,\n            \"status\": \"ok\" if learnable and slot.energy_kwh is not None else (\"profile_unclassified\" if not learnable else \"unavailable\"),\n            \"period_start\": slot.start.isoformat(),\n            \"period_end\": slot.end.isoformat(),\n            \"profile\": snapshot[\"profile\"],\n            \"sample_count\": slot.sample_count,\n            \"source\": slot.source,\n            \"confidence\": slot.confidence,\n        }\n\n    def _initial_result(self) -> dict[str, Any]:\n        return {\"value\": None, \"status\": \"initializing\", \"profile\": self.coordinator.profile, \"blockers\": [\"forecast_calculation_pending\"]}\n\n    @property\n    def native_value(self) -> float | None:\n        return self._result().get(\"value\")\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        result = dict(self._result())\n        result.pop(\"value\", None)\n        return result\n\n\n'''
          sensor = replace_once(sensor, old_next, new_next, 'Next Quarter async cache')

          old_conf = '''class DummyOSHomeForecastConfidenceSensor(DummyOSBaseSensor):\n    _attr_name = \"DO Energy Forecast Confidence\"\n    _attr_unique_id = \"do_energy_forecast_confidence\"\n    _attr_suggested_object_id = \"do_energy_forecast_confidence\"\n    _attr_native_unit_of_measurement = PERCENTAGE\n    _attr_icon = \"mdi:shield-check-outline\"\n\n    @property\n    def native_value(self) -> float | None:\n        return HomeBaselineForecast.average_confidence(self._forecast())\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        return {\n            \"status\": \"ok\" if self._profile_learnable else \"profile_unclassified\",\n            \"profile\": self.coordinator.profile,\n            \"slot_count\": len(self._forecast()),\n            \"model_version\": \"0.4\",\n            \"confidence_basis\": \"historical_source_and_sample_support\",\n        }\n\n\n'''
          new_conf = '''class DummyOSHomeForecastConfidenceSensor(DummyOSAsyncPlannerResultSensor):\n    _attr_name = \"DO Energy Forecast Confidence\"\n    _attr_unique_id = \"do_energy_forecast_confidence\"\n    _attr_suggested_object_id = \"do_energy_forecast_confidence\"\n    _attr_native_unit_of_measurement = PERCENTAGE\n    _attr_icon = \"mdi:shield-check-outline\"\n\n    def _calculate_result(self, snapshot: dict[str, Any]) -> dict[str, Any]:\n        slots = _build_public_forecast_from_snapshot(snapshot)\n        return {\n            \"value\": HomeBaselineForecast.average_confidence(slots),\n            \"status\": \"ok\" if snapshot[\"profile\"] in PROFILE_LEARNING_OPTIONS else \"profile_unclassified\",\n            \"profile\": snapshot[\"profile\"],\n            \"slot_count\": len(slots),\n            \"model_version\": \"0.4\",\n            \"confidence_basis\": \"historical_source_and_sample_support\",\n        }\n\n    def _initial_result(self) -> dict[str, Any]:\n        return {\"value\": None, \"status\": \"initializing\", \"profile\": self.coordinator.profile, \"slot_count\": 0, \"model_version\": \"0.4\", \"confidence_basis\": \"historical_source_and_sample_support\", \"blockers\": [\"forecast_calculation_pending\"]}\n\n    @property\n    def native_value(self) -> float | None:\n        return self._result().get(\"value\")\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        result = dict(self._result())\n        result.pop(\"value\", None)\n        return result\n\n\n'''
          sensor = replace_once(sensor, old_conf, new_conf, 'Forecast Confidence async cache')

          quality_marker = 'class DummyOSHomeForecastQualityByDaypartSensor(DummyOSBaseSensor):\n'
          quality_base = '''class DummyOSAsyncQualitySensor(DummyOSAsyncPlannerResultSensor):\n    \"\"\"Executor-backed base for expensive observer-only quality diagnostics.\"\"\"\n\n    _empty_collection_key = \"items\"\n    _initial_extra: dict[str, Any] = {}\n\n    def _initial_result(self) -> dict[str, Any]:\n        result = {\n            \"status\": \"initializing\",\n            \"profile\": self.coordinator.profile,\n            \"minimum_samples_for_sufficient_basis\": 32,\n            self._empty_collection_key: {},\n            \"blockers\": [\"quality_calculation_pending\"],\n        }\n        result.update(self._initial_extra)\n        return result\n\n    @property\n    def _quality(self) -> dict[str, Any]:\n        return self._result()\n\n\nclass DummyOSHomeForecastQualityByDaypartSensor(DummyOSAsyncQualitySensor):\n'''
          sensor = replace_once(sensor, quality_marker, quality_base, 'quality async base')

          patterns = [
              ('DummyOSHomeForecastQualityByDaypartSensor', 'dayparts', 'calculate_daypart_quality', ''),
              ('DummyOSHomeForecastQualityByDayTypeSensor', 'day_types', 'calculate_day_type_quality', ''),
              ('DummyOSHomeForecastQualityByDayTypeAndDaypartSensor', 'combinations', 'calculate_day_type_daypart_quality', ''),
              ('DummyOSHomeForecastQualityByHourSensor', 'hours', 'calculate_hour_quality', '    _initial_extra = {\"scope\": \"afternoon_12_18\"}\n'),
          ]
          for cls, key, func, extra in patterns:
              sensor = sensor.replace(f'class {cls}(DummyOSBaseSensor):', f'class {cls}(DummyOSAsyncQualitySensor):', 1) if cls != 'DummyOSHomeForecastQualityByDaypartSensor' else sensor
              class_pos = sensor.index(f'class {cls}(DummyOSAsyncQualitySensor):')
              prop_pos = sensor.index('    @property\n    def _quality(self) -> dict[str, Any]:\n', class_pos)
              next_prop = sensor.index('    @property\n    def native_value', prop_pos)
              if key == 'hours':
                  blocked = '{\"status\": \"blocked\", \"profile\": profile, \"minimum_samples_for_sufficient_basis\": 32, \"scope\": \"afternoon_12_18\", \"hours\": {}, \"blockers\": [\"profile_unclassified\"]}'
              else:
                  blocked = '{\"status\": \"blocked\", \"profile\": profile, \"minimum_samples_for_sufficient_basis\": 32, \"' + key + '\": {}, \"blockers\": [\"profile_unclassified\"]}'
              replacement = f'    _empty_collection_key = \"{key}\"\n' + extra + '\n    def _calculate_result(self, snapshot: dict[str, Any]) -> dict[str, Any]:\n        profile = snapshot[\"profile\"]\n        if profile not in PROFILE_LEARNING_OPTIONS:\n            return ' + blocked + f'\n        return {func}(snapshot[\"evaluations\"], snapshot[\"records\"], profile, dt_util.as_local)\n\n'
              sensor = sensor[:prop_pos] + replacement + sensor[next_prop:]

          sensor_path.write_text(sensor)

          solar_path = Path('custom_components/dummy_os_data/solar_sensor.py')
          solar = solar_path.read_text()
          old_init = '''    def __init__(self, coordinator, day: str, roof: str) -> None:\n        super().__init__(coordinator)\n        self.day = day\n        self.roof = roof\n        object_id = f\"do_solar_forecast_{day}_{roof}\"\n        self._attr_name = f\"DO Solar Forecast {day.title()} {roof.title()}\"\n        self._attr_unique_id = object_id\n        self._attr_suggested_object_id = object_id\n\n    @property\n    def native_value(self) -> float | None:\n        if not self.solar.points:\n            return None\n        local_today = dt_util.as_local(dt_util.utcnow()).date()\n        target = local_today if self.day == \"today\" else local_today + timedelta(days=1)\n        return self.solar.energy_for_local_date(target, self.roof)\n'''
          new_init = '''    def __init__(self, coordinator, day: str, roof: str) -> None:\n        super().__init__(coordinator)\n        self.day = day\n        self.roof = roof\n        self._cached_value: float | None = None\n        self._refresh_task = None\n        self._refresh_pending = False\n        object_id = f\"do_solar_forecast_{day}_{roof}\"\n        self._attr_name = f\"DO Solar Forecast {day.title()} {roof.title()}\"\n        self._attr_unique_id = object_id\n        self._attr_suggested_object_id = object_id\n\n    async def async_added_to_hass(self) -> None:\n        await super().async_added_to_hass()\n        self._schedule_refresh()\n\n    async def async_will_remove_from_hass(self) -> None:\n        if self._refresh_task is not None and not self._refresh_task.done():\n            self._refresh_task.cancel()\n        await super().async_will_remove_from_hass()\n\n    @callback\n    def _handle_update(self) -> None:\n        self._schedule_refresh()\n\n    @callback\n    def _schedule_refresh(self) -> None:\n        if self._refresh_task is not None and not self._refresh_task.done():\n            self._refresh_pending = True\n            return\n        self._refresh_task = self.solar.hass.async_create_task(self._async_refresh_value())\n\n    async def _async_refresh_value(self) -> None:\n        while True:\n            self._refresh_pending = False\n            points = list(self.solar.points)\n            local_today = dt_util.as_local(dt_util.utcnow()).date()\n            target = local_today if self.day == \"today\" else local_today + timedelta(days=1)\n            self._cached_value = await self.solar.hass.async_add_executor_job(\n                self._calculate_value, points, target, self.roof\n            )\n            self.async_write_ha_state()\n            if not self._refresh_pending:\n                return\n\n    @staticmethod\n    def _calculate_value(points, target, roof: str) -> float | None:\n        if not points:\n            return None\n        field = {\"north\": \"north_kwh\", \"south\": \"south_kwh\", \"total\": \"total_kwh\"}[roof]\n        return round(sum(getattr(point, field) for point in points if dt_util.as_local(point.start).date() == target), 3)\n\n    @property\n    def native_value(self) -> float | None:\n        return self._cached_value\n'''
          solar = replace_once(solar, old_init, new_init, 'Solar Daily async cache')
          solar_path.write_text(solar)

          version = '0.2.0-alpha.8'
          previous = '0.2.0-alpha.7'
          p = Path('custom_components/dummy_os_data/const.py')
          t = p.read_text(); t = replace_once(t, f'VERSION = \"{previous}\"', f'VERSION = \"{version}\"', 'const version'); p.write_text(t)
          p = Path('custom_components/dummy_os_data/manifest.json')
          data = json.loads(p.read_text())
          if data.get('version') != previous: raise SystemExit('unexpected manifest version')
          data['version'] = version; p.write_text(json.dumps(data, indent=2) + '\n')
          p = Path('tests/test_release_consistency.py')
          t = p.read_text(); t = replace_once(t, f'VERSION = \"{previous}\"', f'VERSION = \"{version}\"', 'test release version'); p.write_text(t)

          test = '''from pathlib import Path\n\nROOT = Path(__file__).parents[1]\n\ndef test_remaining_main_thread_paths_are_executor_backed():\n    sensor = (ROOT / \"custom_components/dummy_os_data/sensor.py\").read_text()\n    solar = (ROOT / \"custom_components/dummy_os_data/solar_sensor.py\").read_text()\n    assert \"class DummyOSHomeForecastNextQuarterSensor(DummyOSAsyncPlannerResultSensor)\" in sensor\n    assert \"class DummyOSHomeForecastConfidenceSensor(DummyOSAsyncPlannerResultSensor)\" in sensor\n    assert \"class DummyOSAsyncQualitySensor(DummyOSAsyncPlannerResultSensor)\" in sensor\n    for name in (\"DummyOSHomeForecastQualityByDaypartSensor\", \"DummyOSHomeForecastQualityByDayTypeSensor\", \"DummyOSHomeForecastQualityByDayTypeAndDaypartSensor\", \"DummyOSHomeForecastQualityByHourSensor\"):\n        assert f\"class {name}(DummyOSAsyncQualitySensor)\" in sensor\n    assert \"async_add_executor_job\" in solar\n    assert \"def _calculate_value(points, target, roof: str)\" in solar\n    assert \"return self.solar.energy_for_local_date(target, self.roof)\" not in solar\n\ndef test_identity_and_safety_invariants_remain_present():\n    sensor = (ROOT / \"custom_components/dummy_os_data/sensor.py\").read_text()\n    preview = (ROOT / \"custom_components/dummy_os_data/do_plan_preview.py\").read_text()\n    for unique_id in (\"do_energy_forecast_next_quarter\", \"do_energy_forecast_confidence\", \"do_energy_forecast_quality_by_daypart\"):\n        assert unique_id in sensor\n    for unique_id in (\"do_solar_forecast_today_total\", \"do_solar_forecast_today_north\", \"do_solar_forecast_today_south\"):\n        assert unique_id in (ROOT / \"custom_components/dummy_os_data/solar_sensor.py\").read_text()\n    assert '\"shadow_only\": True' in preview\n    assert '\"active_use_permitted\": False' in preview\n    assert '\"physical_execution_authority\": False' in preview\n'''
          Path('tests/test_pre_step5_remaining_main_thread_fix.py').write_text(test)

          notes = '''# GitHub Release\n\n**Tag:** `0.2.0-alpha.8`  \n**Release title:** Dummy OS Energy 0.2.0-alpha.8 - Remaining Main-Thread Performance Fix\n\n## Dummy OS Energy 0.2.0-alpha.8\n\nDeze prerelease rondt de pre-Step5 main-threadperformancefix af voor de vier resterende startupwaarschuwingen uit de live alpha.7-validatie. Planner Stap 5 wordt niet toegevoegd.\n\n### Opgelost\n- `DO Energy Forecast Next Quarter` bouwt de forecast niet langer synchronisch vanuit de entity state-property; de berekening draait via executor-backed caching.\n- `DO Energy Forecast Confidence` gebruikt hetzelfde executor-backed cachepatroon.\n- De gelijk opgebouwde observer-only qualitysensoren (Daypart, Day Type, Day Type And Daypart en Hour) voeren hun zware kwaliteitsberekeningen buiten de Home Assistant main thread uit en publiceren alleen het laatst voltooide resultaat.\n- De Solar Daily-sensoren voor today/tomorrow en north/south/total berekenen hun dagtotalen buiten de main thread en cachen de uitkomst.\n\n### Bewust ongewijzigd\n- native 15 minuten / 72 uur / exact 288 slots;\n- forecastformules en historical_baseline model 0.4;\n- entity-identiteiten;\n- Planner Stap 1 t/m 4;\n- reserve-/SOC-, prijs- en solarcontracten;\n- `shadow_only=true`, `active_use_permitted=false` en `physical_execution_authority=false`;\n- unknown/unavailable wordt niet als nul behandeld;\n- geen Planner Stap 5-functionaliteit.\n\n### Live-validatie na installatie\nNa installatie via HACS en een volledige Home Assistant-herstart moet worden gecontroleerd dat de vier in alpha.7 gemeten waarschuwingen niet terugkomen voor:\n- `sensor.do_energy_forecast_next_quarter` (1,213 s in alpha.7);\n- `sensor.do_energy_forecast_confidence` (0,497 s);\n- `sensor.do_energy_forecast_quality_by_daypart` (0,413 s);\n- `sensor.do_solar_forecast_today_total` (1,123 s).\n\nDaarnaast controleren op nieuwe Dummy OS Energy main-threadwaarschuwingen en bevestigen dat de observer/safetygrenzen ongewijzigd zijn. Planner Stap 5 blijft geparkeerd totdat deze live gate geslaagd is.\n'''
          Path(f'RELEASE_NOTES_{version}.md').write_text(notes)
          history = Path('RELEASE_NOTES.md')
          existing = history.read_text()
          if f'**Tag:** `{version}`' in existing: raise SystemExit('alpha.8 notes already present')
          history.write_text(notes + '\n---\n' + existing)
          PY
      - run: python -m pip install --upgrade pytest
      - name: Validate targeted fix
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.8"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.8"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.8`' RELEASE_NOTES_0.2.0-alpha.8.md
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Commit targeted fix
        run: |
          rm .github/workflows/apply-pre-step5-final-main-thread-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move remaining forecast quality and solar calculations off main thread"
          git push origin HEAD:pre-step5-final-main-thread-fix
