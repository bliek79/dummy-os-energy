name: Publish alpha.21
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-alpha21.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env: {VERSION: 0.2.0-alpha.21}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pytest
      - name: Final release gate
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.21"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.21"' custom_components/dummy_os_data/manifest.json
      - name: Build install assets
        run: |
          mkdir -p dist
          cd custom_components
          zip -qr ../dist/Dummy_OS_Energy_0.2.0-alpha.21_HA_install.zip dummy_os_data
          cd ..
          sha256sum dist/Dummy_OS_Energy_0.2.0-alpha.21_HA_install.zip | sed 's#dist/##' > dist/SHA256SUMS-0.2.0-alpha.21.txt
      - name: Publish prerelease
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git tag -a "$VERSION" -m "Dummy OS Energy $VERSION - Central SOC Contract v1"
          git push origin "$VERSION"
          gh release create "$VERSION" dist/Dummy_OS_Energy_0.2.0-alpha.21_HA_install.zip dist/SHA256SUMS-0.2.0-alpha.21.txt --title "Dummy OS Energy 0.2.0-alpha.21 - Central SOC Contract v1" --notes-file RELEASE_NOTES_0.2.0-alpha.21.md --prerelease --verify-tag
