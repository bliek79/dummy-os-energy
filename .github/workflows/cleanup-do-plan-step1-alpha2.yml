name: Cleanup DO Plan Step 1 alpha2

on:
  push:
    branches:
      - do-plan-step1-input-alpha2
    paths:
      - .github/workflows/cleanup-do-plan-step1-alpha2.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-plan-step1-input-alpha2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove generated bytecode and verify
        run: |
          find custom_components tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find custom_components tests -type f -name '*.pyc' -delete
          rm .github/workflows/cleanup-do-plan-step1-alpha2.yml
          python -m pip install --upgrade pytest
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)" || true
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove generated bytecode from Planner Step 1 branch'
          git push origin do-plan-step1-input-alpha2
