name: Publish Dummy OS Forecast alpha.12.19

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha12-19.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: 0.1.0-alpha.12.19
      ZIP_NAME: Dummy_OS_Forecast_0.1.0-alpha.12.19_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-alpha12.19.txt
      EXPECTED_SHA: 475a5c3890e1710b2315c9e8c05d39555e7d695d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact merge target
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          git show "$EXPECTED_SHA":custom_components/dummy_os_data/manifest.json | grep -F '"version": "0.1.0-alpha.12.19"'
          git show "$EXPECTED_SHA":custom_components/dummy_os_data/const.py | grep -F 'VERSION = "0.1.0-alpha.12.19"'
      - name: Build exact release payload from merged commit
        run: |
          rm -rf release-src
          mkdir -p release-src
          git archive "$EXPECTED_SHA" custom_components/dummy_os_data | tar -x -C release-src
          cd release-src
          zip -r "../$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          cd ..
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          git show "$EXPECTED_SHA":RELEASE_NOTES.md > RELEASE_NOTES-alpha12.19.md
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$ZIP_NAME" \
            "$CHECKSUM_NAME" \
            --target "$EXPECTED_SHA" \
            --title "Dummy OS Forecast 0.1.0-alpha.12.19 - Energy Profile Contract v1" \
            --notes-file RELEASE_NOTES-alpha12.19.md \
            --prerelease
