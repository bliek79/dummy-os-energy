name: Publish Dummy OS Energy 0.2.0-alpha.10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0.2.0-alpha.10.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
      VERSION: 0.2.0-alpha.10
      ZIP_NAME: Dummy_OS_Energy_0.2.0-alpha.10_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-0.2.0-alpha.10.txt
      RELEASE_TITLE: Dummy OS Energy 0.2.0-alpha.10 - Time Windows Main-Thread Fix
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile and test exact release source
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.10"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.10"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.10`' RELEASE_NOTES_0.2.0-alpha.10.md
          python - <<'PY'
          from pathlib import Path
          sensor = Path('custom_components/dummy_os_data/sensor.py').read_text()
          preview = Path('custom_components/dummy_os_data/do_plan_preview.py').read_text()
          start = sensor.index('class DummyOSEnergyTimeWindowsSensor(DummyOSBaseSensor):')
          end = sensor.index('\n\nclass DummyOSEnergyRecencyWeightingSensor', start)
          block = sensor[start:end]
          assert 'async_add_executor_job' in block
          assert 'self._cached_result' in block
          assert 'self._refresh_pending' in block
          assert 'calculate_peak_learning(evaluations, profile, dt_util.as_local)' in block
          assert 'calculate_time_windows(peak_result, profile, dt_util.as_local)' in block
          assert 'calculate_peak_learning(self.coordinator.evaluations' not in block
          assert '_attr_unique_id = "do_energy_time_windows"' in block
          assert '_attr_suggested_object_id = "do_energy_time_windows"' in block
          assert 'return "DO Energy Time Windows"' in block
          assert '"shadow_only": True' in preview
          assert '"active_use_permitted": False' in preview
          assert '"physical_execution_authority": False' in preview
          PY
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Build package
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          cat "$CHECKSUM_NAME"
      - name: Create tag and pre-release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          git tag "$VERSION" "$RELEASE_COMMIT"
          git push origin "$VERSION"
          gh release create "$VERSION" "$ZIP_NAME" "$CHECKSUM_NAME" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES_0.2.0-alpha.10.md --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-os-energy-0.2.0-alpha.10-published-assets
          path: |
            Dummy_OS_Energy_0.2.0-alpha.10_HA_install.zip
            SHA256SUMS-0.2.0-alpha.10.txt
            RELEASE_NOTES_0.2.0-alpha.10.md
