name: Prepare DO Plan Step 1 alpha2

on:
  push:
    branches:
      - do-plan-step1-input-alpha2
    paths:
      - .github/workflows/prepare-do-plan-step1-alpha2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-plan-step1-input-alpha2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted planner integration patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # Solar: expose only the already fetched source buffer to the planner.
          path = root / 'custom_components/dummy_os_data/solar.py'
          text = path.read_text()
          needle = '''    @property\n    def source_point_count(self) -> int:\n        \"\"\"Return raw aligned points retained for rolling-window continuity.\"\"\"\n        return len(self._source_points)\n'''
          replacement = '''    @property\n    def planner_points(self) -> list[SolarPoint]:\n        \"\"\"Return the already-fetched source buffer for exact planner-hour joins.\"\"\"\n        return list(self._source_points)\n\n    @property\n    def source_point_count(self) -> int:\n        \"\"\"Return raw aligned points retained for rolling-window continuity.\"\"\"\n        return len(self._source_points)\n'''
          assert needle in text, 'solar source_point_count anchor missing'
          path.write_text(text.replace(needle, replacement, 1))

          # Prices: retain a small internal buffer while public timeline stays exactly 288 slots.
          path = root / 'custom_components/dummy_os_data/prices.py'
          text = path.read_text()
          needle = '        self.points: list[PricePoint] = []\n'
          replacement = '        self.points: list[PricePoint] = []\n        self._planner_points: list[PricePoint] = []\n'
          assert needle in text, 'prices points anchor missing'
          text = text.replace(needle, replacement, 1)
          needle = '''        end = current_quarter + timedelta(minutes=FORECAST_SLOTS * QUARTER_MINUTES)\n        timeline = [merged[t] for t in sorted(merged) if current_quarter <= dt_util.as_local(t) < end][:FORECAST_SLOTS]\n'''
          replacement = '''        end = current_quarter + timedelta(minutes=FORECAST_SLOTS * QUARTER_MINUTES)\n        self._planner_points = [\n            merged[t]\n            for t in sorted(merged)\n            if dt_util.as_local(t) >= current_quarter\n        ][: FORECAST_SLOTS + 4]\n        timeline = [merged[t] for t in sorted(merged) if current_quarter <= dt_util.as_local(t) < end][:FORECAST_SLOTS]\n'''
          assert needle in text, 'prices timeline anchor missing'
          text = text.replace(needle, replacement, 1)
          needle = '''    @property\n    def current_point(self) -> PricePoint | None:\n        return self._find_current_point(self.points)\n'''
          replacement = '''    @property\n    def current_point(self) -> PricePoint | None:\n        return self._find_current_point(self.points)\n\n    @property\n    def planner_points(self) -> list[PricePoint]:\n        \"\"\"Return the already-normalized internal buffer for exact planner-hour joins.\"\"\"\n        return list(self._planner_points)\n'''
          assert needle in text, 'prices current_point anchor missing'
          path.write_text(text.replace(needle, replacement, 1))

          # Sensor platform: add one observer-only DO Plan input sensor.
          path = root / 'custom_components/dummy_os_data/sensor.py'
          text = path.read_text()
          needle = 'from .forecast_planner_contract import build_forecast_planner_contract\n'
          replacement = needle + 'from .do_plan_input import build_do_plan_input_72h\n'
          assert needle in text, 'sensor import anchor missing'
          text = text.replace(needle, replacement, 1)
          needle = '            DummyOSEnergyForecastPlannerContractSensor(coordinator),\n'
          replacement = needle + '            DummyOSPlanInput72hSensor(coordinator),\n'
          assert needle in text, 'sensor setup anchor missing'
          text = text.replace(needle, replacement, 1)
          needle = '''class DummyOSHomeForecastNextQuarterSensor(DummyOSBaseSensor):\n'''
          insert = '''class DummyOSPlanInput72hSensor(DummyOSBaseSensor):\n    \"\"\"Observer-only exact 72-hour input matrix for the new internal planner.\"\"\"\n\n    _attr_name = \"DO Plan Input 72h\"\n    _attr_unique_id = \"do_plan_input_72h\"\n    _attr_suggested_object_id = \"do_plan_input_72h\"\n    _attr_icon = \"mdi:table-clock\"\n    _unrecorded_attributes = frozenset({\"rows\"})\n\n    def __init__(self, coordinator: DummyOSHomeDataCoordinator) -> None:\n        super().__init__(coordinator)\n        self._remove_solar_listener = None\n        self._remove_prices_listener = None\n\n    async def async_added_to_hass(self) -> None:\n        await super().async_added_to_hass()\n        self._remove_solar_listener = self.coordinator.solar.async_add_listener(self._handle_update)\n        self._remove_prices_listener = self.coordinator.prices.async_add_listener(self._handle_update)\n\n    async def async_will_remove_from_hass(self) -> None:\n        if self._remove_solar_listener is not None:\n            self._remove_solar_listener()\n        if self._remove_prices_listener is not None:\n            self._remove_prices_listener()\n        await super().async_will_remove_from_hass()\n\n    def _result(self) -> dict[str, Any]:\n        now = dt_util.utcnow()\n        planner_hours = _build_planner_hours_result(self.coordinator, now=now)\n        model = HomeBaselineForecast(self.coordinator.records)\n        slots = model.build(self.coordinator.profile, now=now)\n        contract = build_forecast_planner_contract(\n            planner_hours=planner_hours,\n            model_health=_build_model_health_result(self.coordinator, slots),\n        )\n        return build_do_plan_input_72h(\n            contract=contract,\n            solar_points=self.coordinator.solar.planner_points,\n            price_points=self.coordinator.prices.planner_points,\n            solar_status=self.coordinator.solar.source_status,\n            prices_status=self.coordinator.prices.status,\n            prices_freshness=self.coordinator.prices.freshness,\n        )\n\n    @property\n    def native_value(self) -> str:\n        return str(self._result()[\"status\"])\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        return dict(self._result())\n\n\n'''
          assert needle in text, 'sensor class insertion anchor missing'
          path.write_text(text.replace(needle, insert + needle, 1))

          # Stable canonical entity ID route for the new namespace.
          path = root / 'custom_components/dummy_os_data/__init__.py'
          text = path.read_text()
          needle = '    ("sensor", "do_energy_forecast_planner_contract", "sensor.do_energy_forecast_planner_contract"),\n'
          replacement = needle + '    ("sensor", "do_plan_input_72h", "sensor.do_plan_input_72h"),\n'
          assert needle in text, 'init planner contract migration anchor missing'
          path.write_text(text.replace(needle, replacement, 1))

          # Version bump for the first planner release.
          path = root / 'custom_components/dummy_os_data/const.py'
          text = path.read_text()
          assert 'VERSION = "0.2.0-alpha.1"' in text
          path.write_text(text.replace('VERSION = "0.2.0-alpha.1"', 'VERSION = "0.2.0-alpha.2"', 1))

          path = root / 'custom_components/dummy_os_data/manifest.json'
          manifest = json.loads(path.read_text())
          assert manifest['version'] == '0.2.0-alpha.1'
          manifest['version'] = '0.2.0-alpha.2'
          path.write_text(json.dumps(manifest, indent=2) + '\n')

          path = root / 'tests/test_release_consistency.py'
          text = path.read_text()
          assert 'VERSION = "0.2.0-alpha.1"' in text
          path.write_text(text.replace('VERSION = "0.2.0-alpha.1"', 'VERSION = "0.2.0-alpha.2"', 1))

          # Sensor/source-buffer contract tests.
          path = root / 'tests/test_do_plan_sensor_contract.py'
          path.write_text('''\"\"\"Static integration contract for Planner Step 1.\"\"\"\nfrom pathlib import Path\n\nROOT = Path(__file__).parents[1]\n\ndef test_do_plan_input_sensor_is_registered_and_observer_only():\n    sensor = (ROOT / \"custom_components/dummy_os_data/sensor.py\").read_text()\n    init = (ROOT / \"custom_components/dummy_os_data/__init__.py\").read_text()\n    builder = (ROOT / \"custom_components/dummy_os_data/do_plan_input.py\").read_text()\n    assert 'DummyOSPlanInput72hSensor(coordinator)' in sensor\n    assert '_attr_unique_id = \"do_plan_input_72h\"' in sensor\n    assert '_unrecorded_attributes = frozenset({\"rows\"})' in sensor\n    assert '(\"sensor\", \"do_plan_input_72h\", \"sensor.do_plan_input_72h\")' in init\n    assert '\"physical_execution_authority\": False' in builder\n    assert '\"shadow_only\": True' in builder\n    assert '\"active_use_permitted\": False' in builder\n\ndef test_public_source_timelines_are_not_extended_for_planner():\n    prices = (ROOT / \"custom_components/dummy_os_data/prices.py\").read_text()\n    solar = (ROOT / \"custom_components/dummy_os_data/solar.py\").read_text()\n    assert '[:FORECAST_SLOTS]' in prices\n    assert '[:FORECAST_SLOTS]' in solar\n    assert 'def planner_points(self) -> list[PricePoint]:' in prices\n    assert 'def planner_points(self) -> list[SolarPoint]:' in solar\n''')

          # Release notes are prepended; old release history remains intact.
          path = root / 'RELEASE_NOTES.md'
          old = path.read_text()
          notes = '''# GitHub Release\n\n**Tag:** `0.2.0-alpha.2`  \n**Release title:** Dummy OS Energy 0.2.0-alpha.2 - DO Plan Input 72h\n\n## Dummy OS Energy 0.2.0-alpha.2\n\nDeze pre-release bouwt Planner Stap 1: één observer-only, exact tijdgematchte 72-uurs invoermatrix voor de nieuwe interne Dummy OS Energy-planner.\n\n### Nieuw\n- Nieuwe diagnose-entiteit `sensor.do_plan_input_72h`.\n- Exact 72 contracturen als leidende tijdas.\n- Woningverbruik rechtstreeks uit het Forecast→Planner-contract.\n- Solar en import-/exportprijzen uitsluitend via exact gematchte kwartierstimestamps.\n- Vier echte kwartieren per planneruur vereist; geen nearest-match, interpolatie of padding.\n- `0.0` blijft een geldige echte waarde; missing/NaN/inf wordt nooit stilzwijgend nul.\n- Interne read-only bronbuffers voor Solar en Prices zodat de 72 volledige contracturen kunnen worden afgedekt zonder de publieke 288-slot timelines te verlengen.\n- Compacte SHA-256 `rows_signature` voor parallelvalidatie.\n\n### Veiligheid\n- `shadow_only=true`.\n- `active_use_permitted=false`.\n- `physical_execution_authority=false`.\n- Geen plan store, Scheduler, safety-chain of batterijservice wordt aangeroepen.\n- Dummy OS EMS blijft actief en ongewijzigd als referentie en rollback.\n\n### Live-validatie\n- `sensor.do_plan_input_72h` moet 72 uurankers hebben die exact overeenkomen met het Forecast→Planner-contract.\n- `valid_home_hours`, `valid_solar_hours` en `valid_price_hours` worden afzonderlijk gecontroleerd.\n- Bij volledige brondekking moet `fully_valid_hours=72` zijn.\n- Een runtime bronstoring mag structurele geldigheid niet maskeren en resulteert in `runtime_blocked`.\n- Planner Stap 2 (`do_plan_energy_need`) start pas na expliciete live-validatie van deze inputlaag.\n\n---\n'''
          path.write_text(notes + old)

          # README: only document the observer-only first planner layer.
          path = root / 'README.md'
          text = path.read_text()
          marker = '## '
          insert = '''## DO Plan - observer-only planner foundation\n\nVanaf `0.2.0-alpha.2` bouwt Dummy OS Energy de nieuwe planner intern onder de vaste `do_plan_*` namespace. De eerste laag is `sensor.do_plan_input_72h`: een read-only 72-uurs matrix die Home Forecast, Solar en import-/exportprijzen exact op tijd koppelt. Deze laag neemt geen laad-/ontlaadbeslissingen en heeft geen fysieke uitvoeringsbevoegdheid.\n\n'''
          if '## DO Plan - observer-only planner foundation' not in text:
              pos = text.find(marker)
              if pos == -1:
                  text += '\n\n' + insert
              else:
                  text = text[:pos] + insert + text[pos:]
          path.write_text(text)
          PY
      - name: Remove temporary preparer
        run: rm .github/workflows/prepare-do-plan-step1-alpha2.yml
      - name: Compile and test
        run: |
          python -m pip install --upgrade pytest
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Commit prepared Planner Step 1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate observer-only DO Plan Input 72h alpha2'
          git push origin do-plan-step1-input-alpha2
