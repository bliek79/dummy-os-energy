name: Publish Dummy OS Forecast alpha.12.20

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha12-20.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VERSION: 0.1.0-alpha.12.20
      RELEASE_COMMIT: efb16bd387b6460bae177777147b45b9aca85520
      ZIP_NAME: Dummy_OS_Forecast_0.1.0-alpha.12.20_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-alpha12.20.txt
      RELEASE_TITLE: Dummy OS Forecast 0.1.0-alpha.12.20 - Step 10D Fallback Hierarchy Observer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: efb16bd387b6460bae177777147b45b9aca85520
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Verify pinned release commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - name: Compile and test
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify release and observer contracts
        run: |
          grep -F 'VERSION = "0.1.0-alpha.12.20"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.1.0-alpha.12.20"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.1.0-alpha.12.20`' RELEASE_NOTES.md
          grep -F 'QUARTER_MINUTES = 15' custom_components/dummy_os_data/const.py
          grep -F 'FORECAST_HORIZON_HOURS = 72' custom_components/dummy_os_data/const.py
          grep -F 'RECENCY_HALF_LIFE_DAYS = 28.0' custom_components/dummy_os_data/forecast.py
          grep -F 'ALGORITHM_VERSION = "fallback_hierarchy_observer_v1"' custom_components/dummy_os_data/fallback_hierarchy.py
          grep -F '_attr_unique_id = "do_energy_fallback_hierarchy"' custom_components/dummy_os_data/home_input_sensor.py
          grep -F '"forecast_influence_enabled": False' custom_components/dummy_os_data/home_input_sensor.py
          grep -F '"promotion_ready": False' custom_components/dummy_os_data/home_input_sensor.py
      - name: Build package
        run: |
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          cat "$CHECKSUM_NAME"
      - name: Create tag and pre-release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          git tag "$VERSION" "$RELEASE_COMMIT"
          git push origin "$VERSION"
          gh release create "$VERSION" "$ZIP_NAME" "$CHECKSUM_NAME" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES.md --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-os-forecast-alpha12-20-published-assets
          path: |
            Dummy_OS_Forecast_0.1.0-alpha.12.20_HA_install.zip
            SHA256SUMS-alpha12.20.txt
            RELEASE_NOTES.md
