name: Build SOC Contract v1

on:
  push:
    branches: [soc-contract-v1]
    paths: [.github/workflows/build-soc-contract-v1.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: soc-contract-v1, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build central SOC contract
        run: |
          python - <<'PY'
          from pathlib import Path
          pkg=Path('custom_components/dummy_os_data'); tests=Path('tests')
          (pkg/'do_plan_soc_contract.py').write_text('''"""Central fail-closed SOC Contract v1 for Dummy OS Energy."""\nfrom __future__ import annotations\nimport math\nfrom datetime import datetime, timezone\nfrom typing import Any\nSOC_CONTRACT_VERSION=1\n\ndef build_do_plan_soc_contract(*,source_entity:str,raw_state:Any,now:datetime,last_known_good_soc_percent:float|None=None,last_known_good_observed_at:str|None=None)->dict[str,Any]:\n    now_utc=now.astimezone(timezone.utc) if now.tzinfo is not None else None\n    raw_text=None if raw_state is None else str(raw_state); blockers=[]; reason="ready"; soc=None\n    if not source_entity: blockers.append("soc_source_entity_missing"); reason="soc_source_entity_missing"\n    elif raw_state is None: blockers.append("soc_source_missing"); reason="soc_source_missing"\n    elif raw_text in {"unknown","unavailable","none","None",""}: blockers.append("soc_source_unavailable"); reason="soc_source_unavailable"\n    else:\n        try: candidate=float(raw_state)\n        except (TypeError,ValueError): blockers.append("soc_source_non_numeric"); reason="soc_source_non_numeric"\n        else:\n            if not math.isfinite(candidate): blockers.append("soc_source_non_finite"); reason="soc_source_non_finite"\n            elif candidate<0.0 or candidate>100.0: blockers.append("soc_out_of_range"); reason="soc_out_of_range"\n            else: soc=round(candidate,3)\n    if now_utc is None: blockers.append("soc_observation_time_invalid"); reason=reason if reason!="ready" else "soc_observation_time_invalid"\n    valid=not blockers\n    return {"status":"ready" if valid else "blocked","validation_status":"valid" if valid else "invalid","valid":valid,"contract_version":SOC_CONTRACT_VERSION,"source_entity":source_entity,"raw_source_status":raw_text,"soc_percent":soc if valid else None,"reason":reason,"blockers":sorted(set(blockers)),"observed_at":now_utc.isoformat() if now_utc else None,"last_known_good_soc_percent":last_known_good_soc_percent,"last_known_good_observed_at":last_known_good_observed_at,"last_known_good_used_for_current":False,"fallback_used":False,"fallback_source_entity":None,"shadow_only":True,"active_use_permitted":False,"physical_execution_authority":False}\n''')
          (pkg/'do_plan_soc_contract_sensor.py').write_text('''"""Home Assistant entity for central SOC Contract v1."""\nfrom __future__ import annotations\nfrom datetime import datetime,timezone\nfrom typing import Any\nfrom homeassistant.components.sensor import SensorEntity\nfrom homeassistant.core import callback\nfrom homeassistant.helpers.entity import DeviceInfo\nfrom homeassistant.helpers.event import async_track_state_change_event\nfrom .const import DOMAIN,NAME,VERSION\nfrom .do_plan_soc_contract import build_do_plan_soc_contract\nRAW_SOC_ENTITY="sensor.anker_solix_solarbank_max_ac_185_soc"\nclass DummyOSPlanSOCContractSensor(SensorEntity):\n    _attr_name="DO Plan SOC Contract"; _attr_unique_id="do_plan_soc_contract"; _attr_suggested_object_id="do_plan_soc_contract"; _attr_icon="mdi:battery-check-outline"; _attr_should_poll=False; _attr_has_entity_name=False\n    def __init__(self,coordinator:Any)->None: self.coordinator=coordinator; self._remove_source_listener=None; self._last_known_good_soc_percent=None; self._last_known_good_observed_at=None\n    @property\n    def device_info(self)->DeviceInfo: return DeviceInfo(identifiers={(DOMAIN,"main")},name=NAME,manufacturer="Dummy OS",model="Energy Platform",sw_version=VERSION)\n    def _result(self)->dict[str,Any]:\n        state=self.coordinator.hass.states.get(RAW_SOC_ENTITY); result=build_do_plan_soc_contract(source_entity=RAW_SOC_ENTITY,raw_state=state.state if state else None,now=datetime.now(timezone.utc),last_known_good_soc_percent=self._last_known_good_soc_percent,last_known_good_observed_at=self._last_known_good_observed_at)\n        if result["valid"]: self._last_known_good_soc_percent=result["soc_percent"]; self._last_known_good_observed_at=result["observed_at"]; result["last_known_good_soc_percent"]=self._last_known_good_soc_percent; result["last_known_good_observed_at"]=self._last_known_good_observed_at\n        result["source_last_changed"]=state.last_changed.isoformat() if state else None; result["source_last_updated"]=state.last_updated.isoformat() if state else None; return result\n    @property\n    def native_value(self)->str: return str(self._result().get("status","blocked"))\n    @property\n    def extra_state_attributes(self)->dict[str,Any]: return self._result()\n    async def async_added_to_hass(self)->None: await super().async_added_to_hass(); self._remove_source_listener=async_track_state_change_event(self.coordinator.hass,[RAW_SOC_ENTITY],self._handle_source_update); self.async_write_ha_state()\n    async def async_will_remove_from_hass(self)->None:\n        if self._remove_source_listener: self._remove_source_listener()\n        await super().async_will_remove_from_hass()\n    @callback\n    def _handle_source_update(self,_event)->None: self.async_write_ha_state()\ndef build_do_plan_soc_contract_sensors(coordinator:Any)->list[SensorEntity]: return [DummyOSPlanSOCContractSensor(coordinator)]\n''')
          p=pkg/'sensor.py'; s=p.read_text(); s=s.replace('from .do_plan_reserve_soc import build_do_plan_reserve_soc\n','from .do_plan_reserve_soc import build_do_plan_reserve_soc\nfrom .do_plan_soc_contract_sensor import build_do_plan_soc_contract_sensors\n'); s=s.replace('            DummyOSPlanInput72hSensor(coordinator),\n            DummyOSPlanEnergyNeedSensor(coordinator),','            DummyOSPlanInput72hSensor(coordinator),\n            *build_do_plan_soc_contract_sensors(coordinator),\n            DummyOSPlanEnergyNeedSensor(coordinator),'); s=s.replace('    result["soc_source_entity"] = "sensor.anker_solix_solarbank_max_ac_185_soc"\n    result["source_layer_status"] = "temporary_direct_soc_source_until_planner_source_contract"','    result["soc_source_entity"] = snapshot.get("soc_source_entity", "sensor.do_plan_soc_contract")\n    result["source_layer_status"] = "central_soc_contract_v1"'); s=s.replace('    SOC_ENTITY = "sensor.anker_solix_solarbank_max_ac_185_soc"','    SOC_ENTITY = "sensor.do_plan_soc_contract"',1)
          old='''    def _soc_percent(self) -> float | None:\n        state = self.coordinator.hass.states.get(self.SOC_ENTITY)\n        if state is None or state.state in {"unknown", "unavailable", "none", "None", ""}:\n            return None\n        try:\n            value = float(state.state)\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n\n    def _snapshot(self) -> dict[str, Any]:\n        return _planner_runtime_snapshot(\n            self.coordinator,\n            soc_percent=self._soc_percent(),\n        )\n'''; new='''    def _soc_percent(self) -> float | None:\n        state = self.coordinator.hass.states.get(self.SOC_ENTITY)\n        if state is None or state.state != "ready" or state.attributes.get("valid") is not True:\n            return None\n        try:\n            value = float(state.attributes.get("soc_percent"))\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n\n    def _snapshot(self) -> dict[str, Any]:\n        snapshot = _planner_runtime_snapshot(self.coordinator, soc_percent=self._soc_percent())\n        snapshot["soc_source_entity"] = self.SOC_ENTITY\n        return snapshot\n'''
          if old not in s: raise SystemExit('energy SOC pattern missing')
          p.write_text(s.replace(old,new,1))
          p=pkg/'do_plan_safety_sensor.py'; s=p.read_text().replace('SOC_ENTITY = "sensor.anker_solix_solarbank_max_ac_185_soc"','SOC_ENTITY = "sensor.do_plan_soc_contract"'); old='''    def _soc_percent(self) -> float | None:\n        state = self.coordinator.hass.states.get(SOC_ENTITY)\n        if state is None or state.state in {"unknown", "unavailable", "none", "None", ""}:\n            return None\n        try:\n            value = float(state.state)\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n'''; new='''    def _soc_percent(self) -> float | None:\n        state = self.coordinator.hass.states.get(SOC_ENTITY)\n        if state is None or state.state != "ready" or state.attributes.get("valid") is not True:\n            return None\n        try:\n            value = float(state.attributes.get("soc_percent"))\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n'''
          if old not in s: raise SystemExit('safety SOC pattern missing')
          p.write_text(s.replace(old,new,1))
          (tests/'test_do_plan_soc_contract.py').write_text('''from datetime import datetime,timezone\nfrom custom_components.dummy_os_data.do_plan_soc_contract import build_do_plan_soc_contract\nNOW=datetime(2026,9,11,12,0,tzinfo=timezone.utc)\ndef test_valid():\n r=build_do_plan_soc_contract(source_entity="sensor.raw",raw_state="64.5",now=NOW); assert r["status"]=="ready" and r["soc_percent"]==64.5 and r["blockers"]==[]\ndef test_unknown_lkg_not_used():\n r=build_do_plan_soc_contract(source_entity="sensor.raw",raw_state="unknown",now=NOW,last_known_good_soc_percent=63); assert r["status"]=="blocked" and r["soc_percent"] is None and r["last_known_good_soc_percent"]==63 and r["last_known_good_used_for_current"] is False\ndef test_invalids():\n assert build_do_plan_soc_contract(source_entity="sensor.raw",raw_state="abc",now=NOW)["reason"]=="soc_source_non_numeric"; assert build_do_plan_soc_contract(source_entity="sensor.raw",raw_state="101",now=NOW)["reason"]=="soc_out_of_range"\ndef test_missing_not_zero():\n r=build_do_plan_soc_contract(source_entity="sensor.raw",raw_state=None,now=NOW); assert r["soc_percent"] is None and r["reason"]=="soc_source_missing"\n''')
          (tests/'test_do_plan_soc_contract_wiring.py').write_text('''from pathlib import Path\nR=Path(__file__).parents[1]\ndef test_wiring():\n s=(R/'custom_components/dummy_os_data/sensor.py').read_text(); x=(R/'custom_components/dummy_os_data/do_plan_safety_sensor.py').read_text(); assert 'SOC_ENTITY = "sensor.do_plan_soc_contract"' in s; assert 'SOC_ENTITY = "sensor.do_plan_soc_contract"' in x; assert '*build_do_plan_soc_contract_sensors(coordinator)' in s; assert 'central_soc_contract_v1' in s\n''')
          PY
      - run: python -m pip install --upgrade pytest
      - run: python -m compileall -q custom_components/dummy_os_data tests
      - run: python -m pytest -q tests/test_do_plan_soc_contract.py tests/test_do_plan_soc_contract_wiring.py
      - run: python -m pytest -q
      - run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Commit green implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/dummy_os_data/do_plan_soc_contract.py custom_components/dummy_os_data/do_plan_soc_contract_sensor.py custom_components/dummy_os_data/sensor.py custom_components/dummy_os_data/do_plan_safety_sensor.py tests/test_do_plan_soc_contract.py tests/test_do_plan_soc_contract_wiring.py
          git commit -m 'Add central SOC Contract v1'
          git push origin HEAD:soc-contract-v1
