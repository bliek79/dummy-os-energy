name: Build alpha.22 SOC runtime wiring

on:
  push:
    branches: [alpha22-soc-contract-runtime-wiring]
    paths: [.github/workflows/build-alpha22-soc-runtime-wiring.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha22-soc-contract-runtime-wiring
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch SOC contract runtime wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          pkg = Path('custom_components/dummy_os_data')
          tests = Path('tests')

          soc_sensor = pkg / 'do_plan_soc_contract_sensor.py'
          soc_sensor.write_text('''"""Home Assistant entity and shared runtime for central SOC Contract v1."""\nfrom __future__ import annotations\n\nfrom datetime import datetime, timezone\nfrom typing import Any\n\nfrom homeassistant.components.sensor import SensorEntity\nfrom homeassistant.core import callback\nfrom homeassistant.helpers.entity import DeviceInfo\nfrom homeassistant.helpers.event import async_track_state_change_event\n\nfrom .const import DOMAIN, NAME, VERSION\nfrom .do_plan_soc_contract import build_do_plan_soc_contract\n\nRAW_SOC_ENTITY = "sensor.anker_solix_solarbank_max_ac_185_soc"\n_RUNTIME_ATTR = "_dummy_os_do_plan_soc_contract_runtime"\n\n\nclass DummyOSPlanSOCContractRuntime:\n    """Single source of truth for the validated current SOC contract."""\n\n    def __init__(self, coordinator: Any) -> None:\n        self.coordinator = coordinator\n        self._last_known_good_soc_percent: float | None = None\n        self._last_known_good_observed_at: str | None = None\n\n    def result(self, now: datetime | None = None) -> dict[str, Any]:\n        current = now or datetime.now(timezone.utc)\n        state = self.coordinator.hass.states.get(RAW_SOC_ENTITY)\n        result = build_do_plan_soc_contract(\n            source_entity=RAW_SOC_ENTITY,\n            raw_state=state.state if state is not None else None,\n            now=current,\n            last_known_good_soc_percent=self._last_known_good_soc_percent,\n            last_known_good_observed_at=self._last_known_good_observed_at,\n        )\n        if result["valid"]:\n            self._last_known_good_soc_percent = result["soc_percent"]\n            self._last_known_good_observed_at = result["observed_at"]\n            result["last_known_good_soc_percent"] = self._last_known_good_soc_percent\n            result["last_known_good_observed_at"] = self._last_known_good_observed_at\n        result["source_last_changed"] = state.last_changed.isoformat() if state else None\n        result["source_last_updated"] = state.last_updated.isoformat() if state else None\n        return result\n\n\ndef get_do_plan_soc_contract_runtime(coordinator: Any) -> DummyOSPlanSOCContractRuntime:\n    runtime = getattr(coordinator, _RUNTIME_ATTR, None)\n    if isinstance(runtime, DummyOSPlanSOCContractRuntime):\n        return runtime\n    runtime = DummyOSPlanSOCContractRuntime(coordinator)\n    setattr(coordinator, _RUNTIME_ATTR, runtime)\n    return runtime\n\n\nclass DummyOSPlanSOCContractSensor(SensorEntity):\n    _attr_name = "DO Plan SOC Contract"\n    _attr_unique_id = "do_plan_soc_contract"\n    _attr_suggested_object_id = "do_plan_soc_contract"\n    _attr_icon = "mdi:battery-check-outline"\n    _attr_should_poll = False\n    _attr_has_entity_name = False\n\n    def __init__(self, coordinator: Any) -> None:\n        self.coordinator = coordinator\n        self.runtime = get_do_plan_soc_contract_runtime(coordinator)\n        self._remove_source_listener = None\n\n    @property\n    def device_info(self) -> DeviceInfo:\n        return DeviceInfo(identifiers={(DOMAIN, "main")}, name=NAME, manufacturer="Dummy OS", model="Energy Platform", sw_version=VERSION)\n\n    @property\n    def native_value(self) -> str:\n        return str(self.runtime.result().get("status", "blocked"))\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        return self.runtime.result()\n\n    async def async_added_to_hass(self) -> None:\n        await super().async_added_to_hass()\n        self._remove_source_listener = async_track_state_change_event(self.coordinator.hass, [RAW_SOC_ENTITY], self._handle_source_update)\n        self.async_write_ha_state()\n\n    async def async_will_remove_from_hass(self) -> None:\n        if self._remove_source_listener is not None:\n            self._remove_source_listener()\n        await super().async_will_remove_from_hass()\n\n    @callback\n    def _handle_source_update(self, _event) -> None:\n        self.async_write_ha_state()\n\n\ndef build_do_plan_soc_contract_sensors(coordinator: Any) -> list[SensorEntity]:\n    return [DummyOSPlanSOCContractSensor(coordinator)]\n''', encoding='utf-8')

          safety_path = pkg / 'do_plan_safety_sensor.py'
          s = safety_path.read_text(encoding='utf-8')
          s = s.replace('from .do_plan_scheduler_sensor import DummyOSPlanSchedulerRuntime, get_do_plan_scheduler_runtime\n', 'from .do_plan_scheduler_sensor import DummyOSPlanSchedulerRuntime, get_do_plan_scheduler_runtime\nfrom .do_plan_soc_contract_sensor import get_do_plan_soc_contract_runtime\n')
          old = '''    def _soc_percent(self) -> float | None:\n        state = self.coordinator.hass.states.get(SOC_ENTITY)\n        if state is None or state.state != "ready" or state.attributes.get("valid") is not True:\n            return None\n        try:\n            value = float(state.attributes.get("soc_percent"))\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n'''
          new = '''    def _soc_contract(self) -> dict[str, Any]:\n        return get_do_plan_soc_contract_runtime(self.coordinator).result()\n\n    def _soc_percent(self) -> float | None:\n        contract = self._soc_contract()\n        if contract.get("status") != "ready" or contract.get("valid") is not True:\n            return None\n        try:\n            value = float(contract.get("soc_percent"))\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n'''
          if old not in s:
              raise SystemExit('Safety SOC reader pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('            safety["soc_source_entity"] = SOC_ENTITY\n', '            contract = self._soc_contract()\n            safety["soc_source_entity"] = "runtime:do_plan_soc_contract_v1"\n            safety["soc_contract_entity"] = SOC_ENTITY\n            safety["soc_contract_status"] = contract.get("status")\n            safety["soc_contract_valid"] = contract.get("valid")\n            safety["soc_raw_source_entity"] = contract.get("source_entity")\n', 1)
          s = s.replace('self._remove_source_listener = async_track_state_change_event(self.coordinator.hass, [SOC_ENTITY, RESERVE_ENTITY], self._handle_source_update)', 'self._remove_source_listener = async_track_state_change_event(self.coordinator.hass, [RAW_SOC_ENTITY, RESERVE_ENTITY], self._handle_source_update)')
          s = s.replace('from .do_plan_soc_contract_sensor import get_do_plan_soc_contract_runtime\n', 'from .do_plan_soc_contract_sensor import RAW_SOC_ENTITY, get_do_plan_soc_contract_runtime\n')
          safety_path.write_text(s, encoding='utf-8')

          sensor_path = pkg / 'sensor.py'
          src = sensor_path.read_text(encoding='utf-8')
          src = src.replace('from .do_plan_soc_contract_sensor import build_do_plan_soc_contract_sensors\n', 'from .do_plan_soc_contract_sensor import build_do_plan_soc_contract_sensors, get_do_plan_soc_contract_runtime\n')
          old = '''    def _soc_percent(self) -> float | None:\n        state = self.coordinator.hass.states.get(self.SOC_ENTITY)\n        if state is None or state.state != "ready" or state.attributes.get("valid") is not True:\n            return None\n        try:\n            value = float(state.attributes.get("soc_percent"))\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n\n    def _snapshot(self) -> dict[str, Any]:\n        snapshot = _planner_runtime_snapshot(\n            self.coordinator,\n            soc_percent=self._soc_percent(),\n        )\n        snapshot["soc_source_entity"] = self.SOC_ENTITY\n        return snapshot\n'''
          new = '''    def _soc_contract(self) -> dict[str, Any]:\n        return get_do_plan_soc_contract_runtime(self.coordinator).result()\n\n    def _soc_percent(self) -> float | None:\n        contract = self._soc_contract()\n        if contract.get("status") != "ready" or contract.get("valid") is not True:\n            return None\n        try:\n            value = float(contract.get("soc_percent"))\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n\n    def _snapshot(self) -> dict[str, Any]:\n        contract = self._soc_contract()\n        snapshot = _planner_runtime_snapshot(\n            self.coordinator,\n            soc_percent=self._soc_percent(),\n        )\n        snapshot["soc_source_entity"] = "runtime:do_plan_soc_contract_v1"\n        snapshot["soc_contract_entity"] = self.SOC_ENTITY\n        snapshot["soc_contract_status"] = contract.get("status")\n        snapshot["soc_contract_valid"] = contract.get("valid")\n        snapshot["soc_raw_source_entity"] = contract.get("source_entity")\n        return snapshot\n'''
          if old not in src:
              raise SystemExit('Energy Need SOC reader pattern not found')
          src = src.replace(old, new, 1)
          sensor_path.write_text(src, encoding='utf-8')

          (tests / 'test_do_plan_soc_runtime_wiring.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).parents[1]\n\n\ndef test_energy_need_uses_shared_soc_runtime_not_entity_lookup():\n    source = (ROOT / "custom_components/dummy_os_data/sensor.py").read_text()\n    assert 'get_do_plan_soc_contract_runtime(self.coordinator).result()' in source\n    assert 'snapshot["soc_source_entity"] = "runtime:do_plan_soc_contract_v1"' in source\n\n\ndef test_safety_uses_shared_soc_runtime_and_raw_source_listener():\n    source = (ROOT / "custom_components/dummy_os_data/do_plan_safety_sensor.py").read_text()\n    assert 'get_do_plan_soc_contract_runtime(self.coordinator).result()' in source\n    assert '[RAW_SOC_ENTITY, RESERVE_ENTITY]' in source\n    assert 'safety["soc_source_entity"] = "runtime:do_plan_soc_contract_v1"' in source\n\n\ndef test_contract_sensor_and_consumers_share_one_runtime():\n    adapter = (ROOT / "custom_components/dummy_os_data/do_plan_soc_contract_sensor.py").read_text()\n    assert 'class DummyOSPlanSOCContractRuntime' in adapter\n    assert '_RUNTIME_ATTR = "_dummy_os_do_plan_soc_contract_runtime"' in adapter\n    assert 'self.runtime = get_do_plan_soc_contract_runtime(coordinator)' in adapter\n''', encoding='utf-8')
          PY
      - run: python -m pip install --upgrade pytest
      - name: Compile
        run: python -m compileall -q custom_components/dummy_os_data tests
      - name: Focused tests
        run: python -m pytest -q tests/test_do_plan_soc_contract.py tests/test_do_plan_soc_contract_wiring.py tests/test_do_plan_soc_runtime_wiring.py
      - name: Full tests
        run: python -m pytest -q
      - name: Commit green hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dummy_os_data/do_plan_soc_contract_sensor.py custom_components/dummy_os_data/do_plan_safety_sensor.py custom_components/dummy_os_data/sensor.py tests/test_do_plan_soc_runtime_wiring.py
          git commit -m "Fix SOC contract runtime wiring"
          git push origin HEAD:alpha22-soc-contract-runtime-wiring
