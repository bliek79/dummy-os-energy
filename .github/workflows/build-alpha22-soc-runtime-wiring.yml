name: Build alpha.22 SOC runtime wiring

on:
  push:
    branches: [alpha22-soc-contract-runtime-wiring]
    paths: [.github/workflows/build-alpha22-soc-runtime-wiring.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha22-soc-contract-runtime-wiring
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch SOC contract runtime wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          pkg = Path('custom_components/dummy_os_data')
          tests = Path('tests')

          (pkg / 'do_plan_soc_contract_sensor.py').write_text('''"""Home Assistant entity and shared runtime for central SOC Contract v1."""\nfrom __future__ import annotations\nfrom datetime import datetime, timezone\nfrom typing import Any\nfrom homeassistant.components.sensor import SensorEntity\nfrom homeassistant.core import callback\nfrom homeassistant.helpers.entity import DeviceInfo\nfrom homeassistant.helpers.event import async_track_state_change_event\nfrom .const import DOMAIN, NAME, VERSION\nfrom .do_plan_soc_contract import build_do_plan_soc_contract\nRAW_SOC_ENTITY = "sensor.anker_solix_solarbank_max_ac_185_soc"\n_RUNTIME_ATTR = "_dummy_os_do_plan_soc_contract_runtime"\nclass DummyOSPlanSOCContractRuntime:\n    def __init__(self, coordinator: Any) -> None:\n        self.coordinator = coordinator; self._last_known_good_soc_percent = None; self._last_known_good_observed_at = None\n    def result(self, now: datetime | None = None) -> dict[str, Any]:\n        current = now or datetime.now(timezone.utc); state = self.coordinator.hass.states.get(RAW_SOC_ENTITY)\n        result = build_do_plan_soc_contract(source_entity=RAW_SOC_ENTITY, raw_state=state.state if state else None, now=current, last_known_good_soc_percent=self._last_known_good_soc_percent, last_known_good_observed_at=self._last_known_good_observed_at)\n        if result["valid"]:\n            self._last_known_good_soc_percent = result["soc_percent"]; self._last_known_good_observed_at = result["observed_at"]; result["last_known_good_soc_percent"] = self._last_known_good_soc_percent; result["last_known_good_observed_at"] = self._last_known_good_observed_at\n        result["source_last_changed"] = state.last_changed.isoformat() if state else None; result["source_last_updated"] = state.last_updated.isoformat() if state else None\n        return result\ndef get_do_plan_soc_contract_runtime(coordinator: Any) -> DummyOSPlanSOCContractRuntime:\n    runtime = getattr(coordinator, _RUNTIME_ATTR, None)\n    if isinstance(runtime, DummyOSPlanSOCContractRuntime): return runtime\n    runtime = DummyOSPlanSOCContractRuntime(coordinator); setattr(coordinator, _RUNTIME_ATTR, runtime); return runtime\nclass DummyOSPlanSOCContractSensor(SensorEntity):\n    _attr_name = "DO Plan SOC Contract"; _attr_unique_id = "do_plan_soc_contract"; _attr_suggested_object_id = "do_plan_soc_contract"; _attr_icon = "mdi:battery-check-outline"; _attr_should_poll = False; _attr_has_entity_name = False\n    def __init__(self, coordinator: Any) -> None:\n        self.coordinator = coordinator; self.runtime = get_do_plan_soc_contract_runtime(coordinator); self._remove_source_listener = None\n    @property\n    def device_info(self) -> DeviceInfo: return DeviceInfo(identifiers={(DOMAIN, "main")}, name=NAME, manufacturer="Dummy OS", model="Energy Platform", sw_version=VERSION)\n    @property\n    def native_value(self) -> str: return str(self.runtime.result().get("status", "blocked"))\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]: return self.runtime.result()\n    async def async_added_to_hass(self) -> None:\n        await super().async_added_to_hass(); self._remove_source_listener = async_track_state_change_event(self.coordinator.hass, [RAW_SOC_ENTITY], self._handle_source_update); self.async_write_ha_state()\n    async def async_will_remove_from_hass(self) -> None:\n        if self._remove_source_listener is not None: self._remove_source_listener()\n        await super().async_will_remove_from_hass()\n    @callback\n    def _handle_source_update(self, _event) -> None: self.async_write_ha_state()\ndef build_do_plan_soc_contract_sensors(coordinator: Any) -> list[SensorEntity]: return [DummyOSPlanSOCContractSensor(coordinator)]\n''', encoding='utf-8')

          safety_path = pkg / 'do_plan_safety_sensor.py'
          safety = safety_path.read_text(encoding='utf-8')
          safety = safety.replace('from .do_plan_scheduler_sensor import DummyOSPlanSchedulerRuntime, get_do_plan_scheduler_runtime\n', 'from .do_plan_scheduler_sensor import DummyOSPlanSchedulerRuntime, get_do_plan_scheduler_runtime\nfrom .do_plan_soc_contract_sensor import RAW_SOC_ENTITY, get_do_plan_soc_contract_runtime\n')
          old = '''    def _soc_percent(self) -> float | None:\n        state = self.coordinator.hass.states.get(SOC_ENTITY)\n        if state is None or state.state != "ready" or state.attributes.get("valid") is not True:\n            return None\n        try:\n            value = float(state.attributes.get("soc_percent"))\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n'''
          new = '''    def _soc_contract(self) -> dict[str, Any]:\n        return get_do_plan_soc_contract_runtime(self.coordinator).result()\n\n    def _soc_percent(self) -> float | None:\n        contract = self._soc_contract()\n        if contract.get("status") != "ready" or contract.get("valid") is not True:\n            return None\n        try:\n            value = float(contract.get("soc_percent"))\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n'''
          assert old in safety
          safety = safety.replace(old, new, 1)
          safety = safety.replace('            safety["soc_source_entity"] = SOC_ENTITY\n', '            contract = self._soc_contract()\n            safety["soc_source_entity"] = "runtime:do_plan_soc_contract_v1"\n            safety["soc_contract_entity"] = SOC_ENTITY\n            safety["soc_contract_status"] = contract.get("status")\n            safety["soc_contract_valid"] = contract.get("valid")\n            safety["soc_raw_source_entity"] = contract.get("source_entity")\n', 1)
          safety = safety.replace('[SOC_ENTITY, RESERVE_ENTITY]', '[RAW_SOC_ENTITY, RESERVE_ENTITY]')
          safety_path.write_text(safety, encoding='utf-8')

          sensor_path = pkg / 'sensor.py'
          src = sensor_path.read_text(encoding='utf-8')
          src = src.replace('from .do_plan_soc_contract_sensor import build_do_plan_soc_contract_sensors\n', 'from .do_plan_soc_contract_sensor import RAW_SOC_ENTITY, build_do_plan_soc_contract_sensors, get_do_plan_soc_contract_runtime\n')
          old = '''    def _soc_percent(self) -> float | None:\n        state = self.coordinator.hass.states.get(self.SOC_ENTITY)\n        if state is None or state.state != "ready" or state.attributes.get("valid") is not True:\n            return None\n        try:\n            value = float(state.attributes.get("soc_percent"))\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n\n    def _snapshot(self) -> dict[str, Any]:\n        snapshot = _planner_runtime_snapshot(self.coordinator, soc_percent=self._soc_percent())\n        snapshot["soc_source_entity"] = self.SOC_ENTITY\n        return snapshot\n'''
          new = '''    def _soc_contract(self) -> dict[str, Any]:\n        return get_do_plan_soc_contract_runtime(self.coordinator).result()\n\n    def _soc_percent(self) -> float | None:\n        contract = self._soc_contract()\n        if contract.get("status") != "ready" or contract.get("valid") is not True:\n            return None\n        try:\n            value = float(contract.get("soc_percent"))\n        except (TypeError, ValueError):\n            return None\n        return value if 0.0 <= value <= 100.0 else None\n\n    def _snapshot(self) -> dict[str, Any]:\n        contract = self._soc_contract()\n        snapshot = _planner_runtime_snapshot(self.coordinator, soc_percent=self._soc_percent())\n        snapshot["soc_source_entity"] = "runtime:do_plan_soc_contract_v1"\n        snapshot["soc_contract_entity"] = self.SOC_ENTITY\n        snapshot["soc_contract_status"] = contract.get("status")\n        snapshot["soc_contract_valid"] = contract.get("valid")\n        snapshot["soc_raw_source_entity"] = contract.get("source_entity")\n        return snapshot\n'''
          assert old in src
          src = src.replace(old, new, 1)
          src = src.replace('[self.SOC_ENTITY],', '[RAW_SOC_ENTITY],', 1)
          sensor_path.write_text(src, encoding='utf-8')

          (tests / 'test_do_plan_soc_runtime_wiring.py').write_text('''from pathlib import Path\nROOT = Path(__file__).parents[1]\ndef test_energy_need_uses_shared_soc_runtime_not_entity_lookup():\n    source = (ROOT / "custom_components/dummy_os_data/sensor.py").read_text()\n    assert 'get_do_plan_soc_contract_runtime(self.coordinator).result()' in source\n    assert 'snapshot["soc_source_entity"] = "runtime:do_plan_soc_contract_v1"' in source\n    assert '[RAW_SOC_ENTITY],' in source\ndef test_safety_uses_shared_soc_runtime_and_raw_source_listener():\n    source = (ROOT / "custom_components/dummy_os_data/do_plan_safety_sensor.py").read_text()\n    assert 'get_do_plan_soc_contract_runtime(self.coordinator).result()' in source\n    assert '[RAW_SOC_ENTITY, RESERVE_ENTITY]' in source\n    assert 'safety["soc_source_entity"] = "runtime:do_plan_soc_contract_v1"' in source\ndef test_contract_sensor_and_consumers_share_one_runtime():\n    adapter = (ROOT / "custom_components/dummy_os_data/do_plan_soc_contract_sensor.py").read_text()\n    assert 'class DummyOSPlanSOCContractRuntime' in adapter\n    assert '_RUNTIME_ATTR = "_dummy_os_do_plan_soc_contract_runtime"' in adapter\n    assert 'self.runtime = get_do_plan_soc_contract_runtime(coordinator)' in adapter\n''', encoding='utf-8')
          PY
      - run: python -m pip install --upgrade pytest
      - name: Compile
        run: python -m compileall -q custom_components/dummy_os_data tests
      - name: Focused tests
        run: python -m pytest -q tests/test_do_plan_soc_contract.py tests/test_do_plan_soc_contract_wiring.py tests/test_do_plan_soc_runtime_wiring.py
      - name: Full tests
        run: python -m pytest -q
      - name: Commit green hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dummy_os_data/do_plan_soc_contract_sensor.py custom_components/dummy_os_data/do_plan_safety_sensor.py custom_components/dummy_os_data/sensor.py tests/test_do_plan_soc_runtime_wiring.py
          git commit -m "Fix SOC contract runtime wiring"
          git push origin HEAD:alpha22-soc-contract-runtime-wiring
