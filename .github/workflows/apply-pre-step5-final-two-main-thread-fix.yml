name: Apply pre-Step5 final two main-thread fixes

on:
  push:
    branches:
      - pre-step5-final-two-main-thread-fix
    paths:
      - .github/workflows/apply-pre-step5-final-two-main-thread-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-step5-final-two-main-thread-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Apply targeted async cache fix and alpha.9 metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing expected block: {label}")
              return text.replace(old, new, 1)

          sensor_path = Path('custom_components/dummy_os_data/sensor.py')
          sensor = sensor_path.read_text()

          old_coverage = '''class DummyOSHomeForecastCoverageSensor(DummyOSBaseSensor):\n    _attr_name = \"DO Energy Forecast Coverage\"\n    _attr_unique_id = \"do_energy_forecast_coverage\"\n    _attr_suggested_object_id = \"do_energy_forecast_coverage\"\n    _attr_native_unit_of_measurement = PERCENTAGE\n    _attr_icon = \"mdi:chart-donut\"\n\n    @property\n    def native_value(self) -> float:\n        slots = self._forecast()\n        return round(sum(1 for slot in slots if slot.source in SUPPORTED_SOURCES) / len(slots) * 100, 1) if slots else 0.0\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        slots = self._forecast()\n        sources: dict[str, int] = {}\n        for slot in slots:\n            sources[slot.source] = sources.get(slot.source, 0) + 1\n        populated = sum(1 for slot in slots if slot.energy_kwh is not None)\n        supported = sum(1 for slot in slots if slot.source in SUPPORTED_SOURCES)\n        return {\n            \"status\": \"ok\" if self._profile_learnable else \"profile_unclassified\",\n            \"profile\": self.coordinator.profile,\n            \"slot_count\": len(slots),\n            \"populated_slots\": populated,\n            \"supported_slots\": supported,\n            \"coverage_percent\": round(supported / len(slots) * 100, 1) if slots else 0.0,\n            \"sources\": sources,\n        }\n\n\n'''
          new_coverage = '''class DummyOSHomeForecastCoverageSensor(DummyOSAsyncPlannerResultSensor):\n    _attr_name = \"DO Energy Forecast Coverage\"\n    _attr_unique_id = \"do_energy_forecast_coverage\"\n    _attr_suggested_object_id = \"do_energy_forecast_coverage\"\n    _attr_native_unit_of_measurement = PERCENTAGE\n    _attr_icon = \"mdi:chart-donut\"\n\n    def _calculate_result(self, snapshot: dict[str, Any]) -> dict[str, Any]:\n        slots = _build_public_forecast_from_snapshot(snapshot)\n        sources: dict[str, int] = {}\n        for slot in slots:\n            sources[slot.source] = sources.get(slot.source, 0) + 1\n        populated = sum(1 for slot in slots if slot.energy_kwh is not None)\n        supported = sum(1 for slot in slots if slot.source in SUPPORTED_SOURCES)\n        coverage = round(supported / len(slots) * 100, 1) if slots else 0.0\n        return {\n            \"value\": coverage,\n            \"status\": \"ok\" if snapshot[\"profile\"] in PROFILE_LEARNING_OPTIONS else \"profile_unclassified\",\n            \"profile\": snapshot[\"profile\"],\n            \"slot_count\": len(slots),\n            \"populated_slots\": populated,\n            \"supported_slots\": supported,\n            \"coverage_percent\": coverage,\n            \"sources\": sources,\n        }\n\n    def _initial_result(self) -> dict[str, Any]:\n        return {\"value\": 0.0, \"status\": \"initializing\", \"profile\": self.coordinator.profile, \"slot_count\": 0, \"populated_slots\": 0, \"supported_slots\": 0, \"coverage_percent\": 0.0, \"sources\": {}, \"blockers\": [\"forecast_calculation_pending\"]}\n\n    @property\n    def native_value(self) -> float:\n        return float(self._result().get(\"value\", 0.0))\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        result = dict(self._result())\n        result.pop(\"value\", None)\n        return result\n\n\n'''
          sensor = replace_once(sensor, old_coverage, new_coverage, 'Forecast Coverage async cache')

          old_peak = '''class DummyOSEnergyPeakLearningSensor(DummyOSBaseSensor):\n    \"\"\"Observer-only Step 6 Energy peak learning diagnostics.\"\"\"\n\n    _attr_name = \"DO Energy Peak Learning\"\n    _attr_unique_id = \"do_energy_peak_learning\"\n    _attr_suggested_object_id = \"do_energy_peak_learning\"\n    _attr_icon = \"mdi:chart-bell-curve-cumulative\"\n    _unrecorded_attributes = frozenset({\"calibration\", \"classifications\", \"events\"})\n\n    @property\n    def name(self) -> str:\n        \"\"\"Return the canonical runtime name used for friendly_name.\"\"\"\n        return \"DO Energy Peak Learning\"\n\n    def _result(self) -> dict[str, Any]:\n        if not self._profile_learnable:\n            return {\n                \"schema_version\": 1,\n                \"algorithm_version\": \"peak_observer_v1\",\n                \"calibration_fingerprint\": None,\n                \"source_basis\": {},\n                \"profile\": self.coordinator.profile,\n                \"status\": \"blocked\",\n                \"minimum_samples_per_hour\": 32,\n                \"minimum_distinct_days_per_hour\": 8,\n                \"threshold_method\": \"leave_one_local_day_out_positive_residual_quantile\",\n                \"threshold_quantile\": 0.9,\n                \"candidate_count\": 0,\n                \"event_count\": 0,\n                \"calibrated_hours\": 0,\n                \"classification_calibration\": {},\n                \"protected_windows\": {},\n                \"calibration\": {},\n                \"classifications\": {},\n                \"events\": [],\n                \"blockers\": [\"profile_unclassified\"],\n            }\n        return calculate_peak_learning(self.coordinator.evaluations, self.coordinator.profile, dt_util.as_local)\n\n    @property\n    def native_value(self) -> str:\n        return str(self._result().get(\"status\", \"collecting\"))\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        result = self._result()\n        return {\n            \"schema_version\": result[\"schema_version\"],\n            \"algorithm_version\": result[\"algorithm_version\"],\n            \"calibration_fingerprint\": result[\"calibration_fingerprint\"],\n            \"source_basis\": result[\"source_basis\"],\n            \"profile\": result[\"profile\"],\n            \"observer_only\": True,\n            \"forecast_influence_enabled\": False,\n            \"ready_for_model_influence\": False,\n            \"minimum_samples_per_hour\": result[\"minimum_samples_per_hour\"],\n            \"minimum_distinct_days_per_hour\": result[\"minimum_distinct_days_per_hour\"],\n            \"threshold_method\": result[\"threshold_method\"],\n            \"threshold_quantile\": result[\"threshold_quantile\"],\n            \"candidate_count\": result[\"candidate_count\"],\n            \"event_count\": result[\"event_count\"],\n            \"calibrated_hours\": result[\"calibrated_hours\"],\n            \"classification_calibration\": result[\"classification_calibration\"],\n            \"protected_windows\": result[\"protected_windows\"],\n            \"calibration\": result[\"calibration\"],\n            \"classifications\": result[\"classifications\"],\n            \"events\": result[\"events\"],\n            \"blockers\": result.get(\"blockers\", []),\n        }\n'''
          new_peak = '''class DummyOSEnergyPeakLearningSensor(DummyOSAsyncPlannerResultSensor):\n    \"\"\"Observer-only Step 6 Energy peak learning diagnostics.\"\"\"\n\n    _attr_name = \"DO Energy Peak Learning\"\n    _attr_unique_id = \"do_energy_peak_learning\"\n    _attr_suggested_object_id = \"do_energy_peak_learning\"\n    _attr_icon = \"mdi:chart-bell-curve-cumulative\"\n    _unrecorded_attributes = frozenset({\"calibration\", \"classifications\", \"events\"})\n\n    @property\n    def name(self) -> str:\n        \"\"\"Return the canonical runtime name used for friendly_name.\"\"\"\n        return \"DO Energy Peak Learning\"\n\n    def _calculate_result(self, snapshot: dict[str, Any]) -> dict[str, Any]:\n        profile = snapshot[\"profile\"]\n        if profile not in PROFILE_LEARNING_OPTIONS:\n            return {\n                \"schema_version\": 1,\n                \"algorithm_version\": \"peak_observer_v1\",\n                \"calibration_fingerprint\": None,\n                \"source_basis\": {},\n                \"profile\": profile,\n                \"status\": \"blocked\",\n                \"minimum_samples_per_hour\": 32,\n                \"minimum_distinct_days_per_hour\": 8,\n                \"threshold_method\": \"leave_one_local_day_out_positive_residual_quantile\",\n                \"threshold_quantile\": 0.9,\n                \"candidate_count\": 0,\n                \"event_count\": 0,\n                \"calibrated_hours\": 0,\n                \"classification_calibration\": {},\n                \"protected_windows\": {},\n                \"calibration\": {},\n                \"classifications\": {},\n                \"events\": [],\n                \"blockers\": [\"profile_unclassified\"],\n            }\n        return calculate_peak_learning(snapshot[\"evaluations\"], profile, dt_util.as_local)\n\n    def _initial_result(self) -> dict[str, Any]:\n        return {\n            \"schema_version\": 1,\n            \"algorithm_version\": \"peak_observer_v1\",\n            \"calibration_fingerprint\": None,\n            \"source_basis\": {},\n            \"profile\": self.coordinator.profile,\n            \"status\": \"initializing\",\n            \"minimum_samples_per_hour\": 32,\n            \"minimum_distinct_days_per_hour\": 8,\n            \"threshold_method\": \"leave_one_local_day_out_positive_residual_quantile\",\n            \"threshold_quantile\": 0.9,\n            \"candidate_count\": 0,\n            \"event_count\": 0,\n            \"calibrated_hours\": 0,\n            \"classification_calibration\": {},\n            \"protected_windows\": {},\n            \"calibration\": {},\n            \"classifications\": {},\n            \"events\": [],\n            \"blockers\": [\"observer_calculation_pending\"],\n        }\n\n    @property\n    def native_value(self) -> str:\n        return str(self._result().get(\"status\", \"initializing\"))\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        result = self._result()\n        return {\n            \"schema_version\": result[\"schema_version\"],\n            \"algorithm_version\": result[\"algorithm_version\"],\n            \"calibration_fingerprint\": result[\"calibration_fingerprint\"],\n            \"source_basis\": result[\"source_basis\"],\n            \"profile\": result[\"profile\"],\n            \"observer_only\": True,\n            \"forecast_influence_enabled\": False,\n            \"ready_for_model_influence\": False,\n            \"minimum_samples_per_hour\": result[\"minimum_samples_per_hour\"],\n            \"minimum_distinct_days_per_hour\": result[\"minimum_distinct_days_per_hour\"],\n            \"threshold_method\": result[\"threshold_method\"],\n            \"threshold_quantile\": result[\"threshold_quantile\"],\n            \"candidate_count\": result[\"candidate_count\"],\n            \"event_count\": result[\"event_count\"],\n            \"calibrated_hours\": result[\"calibrated_hours\"],\n            \"classification_calibration\": result[\"classification_calibration\"],\n            \"protected_windows\": result[\"protected_windows\"],\n            \"calibration\": result[\"calibration\"],\n            \"classifications\": result[\"classifications\"],\n            \"events\": result[\"events\"],\n            \"blockers\": result.get(\"blockers\", []),\n        }\n'''
          sensor = replace_once(sensor, old_peak, new_peak, 'Peak Learning async cache')
          sensor_path.write_text(sensor)

          version = '0.2.0-alpha.9'
          previous = '0.2.0-alpha.8'

          const_path = Path('custom_components/dummy_os_data/const.py')
          const = const_path.read_text()
          const = replace_once(const, f'VERSION = \"{previous}\"', f'VERSION = \"{version}\"', 'const version')
          const_path.write_text(const)

          manifest_path = Path('custom_components/dummy_os_data/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('version') != previous:
              raise SystemExit(f'unexpected manifest version: {manifest.get("version")}')
          manifest['version'] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          release_test = Path('tests/test_release_consistency.py')
          release_text = release_test.read_text()
          release_text = replace_once(release_text, f'VERSION = \"{previous}\"', f'VERSION = \"{version}\"', 'release consistency version')
          release_test.write_text(release_text)

          Path('tests/test_pre_step5_final_two_main_thread_fix.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).parents[1]\n\ndef test_coverage_and_peak_learning_are_executor_backed():\n    sensor = (ROOT / \"custom_components/dummy_os_data/sensor.py\").read_text()\n    assert \"class DummyOSHomeForecastCoverageSensor(DummyOSAsyncPlannerResultSensor)\" in sensor\n    assert \"class DummyOSEnergyPeakLearningSensor(DummyOSAsyncPlannerResultSensor)\" in sensor\n    assert \"return calculate_peak_learning(snapshot[\\\"evaluations\\\"], profile, dt_util.as_local)\" in sensor\n    coverage_block = sensor.split(\"class DummyOSHomeForecastCoverageSensor\", 1)[1].split(\"class DummyOSHomeForecastConfidenceSensor\", 1)[0]\n    assert \"self._forecast()\" not in coverage_block\n    peak_block = sensor.split(\"class DummyOSEnergyPeakLearningSensor\", 1)[1]\n    assert \"calculate_peak_learning(self.coordinator.evaluations\" not in peak_block\n\ndef test_pre_step5_safety_and_identity_invariants_remain_present():\n    sensor = (ROOT / \"custom_components/dummy_os_data/sensor.py\").read_text()\n    preview = (ROOT / \"custom_components/dummy_os_data/do_plan_preview.py\").read_text()\n    for entity_id in (\"do_energy_forecast_coverage\", \"do_energy_peak_learning\"):\n        assert entity_id in sensor\n    assert '\"shadow_only\": True' in preview\n    assert '\"active_use_permitted\": False' in preview\n    assert '\"physical_execution_authority\": False' in preview\n''')

          notes = '''# GitHub Release\n\n**Tag:** `0.2.0-alpha.9`  \n**Release title:** Dummy OS Energy 0.2.0-alpha.9 - Final Pre-Step5 Main-Thread Fix\n\n## Dummy OS Energy 0.2.0-alpha.9\n\nDeze prerelease lost uitsluitend de twee resterende Dummy OS Energy main-threadwaarschuwingen op die na de live alpha.8-validatie overbleven. Planner Stap 5 wordt niet toegevoegd.\n\n### Opgelost\n- `DO Energy Forecast Coverage` bouwt de 72-uurs forecast niet langer synchronisch vanuit de entity state-property; de berekening draait via executor-backed caching.\n- `DO Energy Peak Learning` voert `calculate_peak_learning(...)` niet langer synchronisch uit tijdens entity state updates; de observerberekening draait via dezelfde executor-backed cachelaag.\n\n### Bewust ongewijzigd\n- native 15 minuten / 72 uur / exact 288 slots;\n- forecastformules en historical_baseline model 0.4;\n- Peak Learning-inhoud, drempels en observer-only betekenis;\n- entity-identiteiten;\n- Planner Stap 1 t/m 4;\n- reserve-/SOC-, prijs- en solarcontracten;\n- `shadow_only=true`, `active_use_permitted=false` en `physical_execution_authority=false`;\n- unknown/unavailable wordt niet als nul behandeld;\n- geen Planner Stap 5-functionaliteit.\n\n### Live-validatie na installatie\nNa installatie via HACS en een volledige Home Assistant-herstart moet worden gecontroleerd dat de twee in alpha.8 gemeten waarschuwingen niet terugkomen voor:\n- `sensor.do_energy_forecast_coverage` (0,520 s in alpha.8);\n- `sensor.do_energy_peak_learning` (0,451 s in alpha.8).\n\nDaarnaast controleren op nieuwe Dummy OS Energy main-threadwaarschuwingen. Planner Stap 5 blijft geparkeerd totdat deze live gate geslaagd is.\n'''
          Path(f'RELEASE_NOTES_{version}.md').write_text(notes)
          history = Path('RELEASE_NOTES.md')
          current = history.read_text()
          if f'**Tag:** `{version}`' in current:
              raise SystemExit('alpha.9 release notes already present')
          history.write_text(notes + '\n---\n' + current)
          PY
      - name: Validate targeted fix
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.9"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.9"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.9`' RELEASE_NOTES_0.2.0-alpha.9.md
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Commit targeted fix
        run: |
          rm .github/workflows/apply-pre-step5-final-two-main-thread-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move final coverage and peak learning calculations off main thread"
          git push origin HEAD:pre-step5-final-two-main-thread-fix
