name: Prepare Dummy OS Forecast alpha.12.25

on:
  push:
    branches:
      - release-alpha12-25-step14-planner-hours
    paths:
      - .github/workflows/prepare-alpha12-25.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-alpha12-25-step14-planner-hours
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release metadata
        run: python .github/scripts/prepare_alpha12_25.py
      - name: Validate release
        run: |
          python -m pip install --upgrade pytest
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.1.0-alpha.12.25"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.1.0-alpha.12.25"' custom_components/dummy_os_data/manifest.json
          grep -F 'VERSION = "0.1.0-alpha.12.25"' tests/test_release_consistency.py
          grep -F '**Tag:** `0.1.0-alpha.12.25`' RELEASE_NOTES.md
          grep -F 'MAX_INTERNAL_FORECAST_SLOTS = FORECAST_SLOTS + 3' custom_components/dummy_os_data/forecast.py
          grep -F 'slot_count: int = FORECAST_SLOTS' custom_components/dummy_os_data/forecast.py
          grep -F 'RECENCY_HALF_LIFE_DAYS = 28.0' custom_components/dummy_os_data/forecast.py
          grep -F 'NATIVE_PUBLIC_SLOTS = 288' custom_components/dummy_os_data/planner_hours.py
          grep -F 'PLANNER_HOUR_COUNT = 72' custom_components/dummy_os_data/planner_hours.py
          grep -F 'QUARTERS_PER_HOUR = 4' custom_components/dummy_os_data/planner_hours.py
          grep -F '"padding_used": False' custom_components/dummy_os_data/planner_hours.py
          grep -F '"second_forecast_architecture": False' custom_components/dummy_os_data/planner_hours.py
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Commit release metadata and remove temporary files
        run: |
          git config user.name "Stefan"
          git config user.email "111599445+bliek79@users.noreply.github.com"
          git add custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json RELEASE_NOTES.md tests/test_release_consistency.py
          git rm .github/scripts/prepare_alpha12_25.py .github/workflows/prepare-alpha12-25.yml
          git commit -m "Release alpha.12.25: Step 14 exact planner hours"
          git push origin HEAD:release-alpha12-25-step14-planner-hours
