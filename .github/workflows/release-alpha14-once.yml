name: Publish Dummy OS Energy 0.2.0-alpha.14 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-alpha14-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: 0.2.0-alpha.14
      ZIP_NAME: Dummy_OS_Energy_0.2.0-alpha.14_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-0.2.0-alpha.14.txt
      RELEASE_TITLE: Dummy OS Energy 0.2.0-alpha.14 - Planner Step 6B Shadow Plan Store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release metadata in package
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [Path('custom_components/dummy_os_data/const.py'), Path('custom_components/dummy_os_data/manifest.json')]:
              text = path.read_text().replace('0.2.0-alpha.13', '0.2.0-alpha.14')
              path.write_text(text)
          PY
      - name: Validate release package
        run: |
          python -m compileall -q custom_components/dummy_os_data
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.14"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.14"' custom_components/dummy_os_data/manifest.json
      - name: Build installation asset and checksum
        run: |
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
      - name: Write release notes
        run: |
          cat > release_notes_alpha14.md <<'EOF'
          ## Dummy OS Energy 0.2.0-alpha.14

          Deze prerelease voegt **Planner Stap 6B - Shadow Plan Store** toe aan Dummy OS Data. Hiermee krijgt de Forecast -> Planner-keten voor het eerst een persistente, strikt observer-only opslaglaag voor toekomstige planneracties.

          ### Toegevoegd
          - `DO Plan Store` als geisoleerde shadow-opslaglaag met exact drie planslots.
          - Persistente opslag over een Home Assistant-herstart.
          - Scheiding tussen `manual` en `automatic_72h_planner`.
          - Harde manual-priority: automatische plannerupdates mogen handmatige slotownership niet overschrijven.
          - Lifecycle voor draft, pending, blocked, cancelled en expired plannen.
          - Candidate -> Plan Store bridge vanuit de bestaande Step-5 planner.
          - Deterministische candidate-identiteit en planner-signatures.
          - Deduplicatie en reconciliation van toekomstige plannerkandidaten.
          - Automatische cleanup van vervallen/obsolete automatische pending-plannen zonder handmatige plannen te wijzigen.
          - Grid Support-prioriteit boven conflicterende trade-kandidaten.
          - Home Assistant-entiteiten voor Plan Store, bridge en drie afzonderlijke slots.

          ### Plan ID release-hardening
          - Python `hash()` is vervangen door een deterministische SHA-256 digest-prefix.
          - Dezelfde planner-input levert ook in een nieuw Python-proces dezelfde nieuwe `plan_id` op.
          - Reconciliation van dezelfde toekomstige planner-identiteit behoudt bestaand `plan_id` en `slot_id`.
          - Fresh-process regressietests bewaken deze stabiliteit.

          ### Validatie
          De volledige CI-suite is voor merge succesvol doorlopen: source compilation, volledige pytest-suite, manifestvalidatie, Step-9 Profile Contract, alpha.12.18 runtime-gate en validation-build.

          ### Architectuur ongewijzigd
          - native resolutie: **15 minuten**;
          - forecast-horizon: **72 uur**;
          - exact **288 slots**;
          - Plan Store: exact **3 planslots**;
          - unknown/unavailable wordt niet stilzwijgend als nul behandeld;
          - geen tweede forecastarchitectuur.

          ### Safety- en executionrechten
          - `shadow_only=true`
          - `shadow_store_write=true`
          - `operational_plan_store_write=false`
          - `active_use_permitted=false`
          - `physical_execution_authority=false`
          - `scheduler_invoked=false`
          - `safety_chain_invoked=false`
          - `service_calls_performed=false`

          Deze prerelease geeft geen recht om de batterij fysiek aan te sturen.

          ### Bewust niet onderdeel
          Planner Stap 7 Scheduler, Safety/Prestart, Execution, fysieke Home Assistant-servicecalls, dashboardmigratie en wijziging van de Grid Support-drempel zijn niet onderdeel van alpha.14. De Grid Support shadow-testwaarde blijft **0,25 kWh**.

          ### Live-validatie na installatie
          Controleer na installatie en een volledige Home Assistant-herstart `sensor.do_plan_store_bridge`, `sensor.do_plan_store`, de drie Plan Store-slots, persistentiebehoud, manual ownership, automatische reconciliation en de blijvend gesloten executionrechten.
          EOF
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ZIP_NAME" "$CHECKSUM_NAME" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release_notes_alpha14.md --prerelease
