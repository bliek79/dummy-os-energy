name: Step 13 feature bootstrap

on:
  push:
    branches:
      - step13-model-health-readiness
    paths:
      - .github/workflows/step13-feature-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step13-model-health-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Step 13 sensor patch
        run: python .github/scripts/step13_patch.py
      - name: Test full repository
        run: |
          python -m pip install --upgrade pytest
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          test "$(git diff main -- custom_components/dummy_os_data/forecast.py | wc -l)" -eq 0
      - name: Commit feature and remove temporary bootstrap files
        run: |
          git config user.name "Stefan"
          git config user.email "111599445+bliek79@users.noreply.github.com"
          git add custom_components/dummy_os_data/sensor.py custom_components/dummy_os_data/model_health.py tests/test_model_health_readiness.py tests/test_model_health_sensor_contract.py
          git rm .github/scripts/step13_patch.py .github/workflows/step13-feature-bootstrap.yml
          git commit -m "Step 13: objective Model Health readiness"
          git push origin HEAD:step13-model-health-readiness
