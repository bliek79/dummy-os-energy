name: Step 15 bootstrap

on:
  push:
    branches:
      - step15-forecast-planner-contract
    paths:
      - .github/workflows/step15-bootstrap.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step15-forecast-planner-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Step 15 patch
        run: |
          python .github/scripts/step15_patch.py
          python .github/scripts/step15_patch_legacy_test.py
      - name: Validate
        run: |
          python -m pip install --upgrade pytest
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'CONTRACT_VERSION = 1' custom_components/dummy_os_data/forecast_planner_contract.py
          grep -F 'NATIVE_SLOT_COUNT = 288' custom_components/dummy_os_data/forecast_planner_contract.py
          grep -F 'PLANNER_HOUR_COUNT = 72' custom_components/dummy_os_data/forecast_planner_contract.py
          grep -F '_attr_unique_id = "do_energy_forecast_planner_contract"' custom_components/dummy_os_data/sensor.py
          grep -F 'slot_count: int = FORECAST_SLOTS' custom_components/dummy_os_data/forecast.py
          grep -F 'RECENCY_HALF_LIFE_DAYS = 28.0' custom_components/dummy_os_data/forecast.py
          test -z "$(git ls-files | grep -E '(__pycache__|\.pyc$)' || true)"
      - name: Commit clean feature patch
        run: |
          git config user.name "Stefan"
          git config user.email "111599445+bliek79@users.noreply.github.com"
          git add custom_components/dummy_os_data tests/test_forecast_planner_contract.py tests/test_forecast_planner_contract_sensor.py tests/test_model_health_sensor_contract.py
          git rm .github/scripts/step15_patch.py .github/scripts/step15_patch_legacy_test.py .github/workflows/step15-bootstrap.yml
          git commit -m "Step 15: stable Forecast to Planner contract"
          git push origin HEAD:step15-forecast-planner-contract
