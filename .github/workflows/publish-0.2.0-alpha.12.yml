name: Publish Dummy OS Energy 0.2.0-alpha.12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0.2.0-alpha.12.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/dummy-os-pycache
      VERSION: 0.2.0-alpha.12
      ZIP_NAME: Dummy_OS_Energy_0.2.0-alpha.12_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-0.2.0-alpha.12.txt
      RELEASE_TITLE: Dummy OS Energy 0.2.0-alpha.12 - Planner Step 5 72h Sequential Simulation
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Validate exact release source
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.12"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.12"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.2.0-alpha.12`' RELEASE_NOTES_0.2.0-alpha.12.md
          grep -F '"shadow_only": True' custom_components/dummy_os_data/do_plan_72h.py
          grep -F '"active_use_permitted": False' custom_components/dummy_os_data/do_plan_72h.py
          grep -F '"physical_execution_authority": False' custom_components/dummy_os_data/do_plan_72h.py
          grep -F '"plan_store_write": False' custom_components/dummy_os_data/do_plan_72h.py
          grep -F '"scheduler_invoked": False' custom_components/dummy_os_data/do_plan_72h.py
          grep -F '"safety_chain_invoked": False' custom_components/dummy_os_data/do_plan_72h.py
          grep -F '"service_calls_performed": False' custom_components/dummy_os_data/do_plan_72h.py
      - name: Build package
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
      - name: Create prerelease
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          git tag "$VERSION" "$RELEASE_COMMIT"
          git push origin "$VERSION"
          gh release create "$VERSION" "$ZIP_NAME" "$CHECKSUM_NAME" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES_0.2.0-alpha.12.md --prerelease
