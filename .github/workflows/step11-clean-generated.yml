name: Step 11 cleanup generated files

on:
  push:
    branches:
      - step11-meaningful-confidence-observer-v2
    paths:
      - .github/workflows/step11-clean-generated.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step11-meaningful-confidence-observer-v2
          fetch-depth: 0
      - name: Remove generated Python cache files
        run: |
          rm -rf custom_components/dummy_os_data/__pycache__ tests/__pycache__
          rm .github/workflows/step11-clean-generated.yml
          git config user.name "Stefan"
          git config user.email "111599445+bliek79@users.noreply.github.com"
          git add -u
          git commit -m "Step 11: remove generated test artifacts"
          git push origin HEAD:step11-meaningful-confidence-observer-v2
